ed to swap one with us.", "Nhóm khác làm đèn lồng tròn đơn giản và đề nghị đổi một chiếc với chúng tôi.", ["Another group made simple", "round lanterns", "and offered to swap", "one with us."]], ["Before the event, we tested the lights because we did not want any lantern to stop working halfway through the evening.", "Trước sự kiện, chúng tôi thử đèn vì không muốn chiếc nào tắt khi chương trình mới diễn ra được một nửa.", ["Before the event,", "we", "tested the lights", "because we did not", "want any lantern to", "stop working halfway through", "the evening."]], ["The teacher asked us to leave a clear route to the gate.", "Cô giáo nhờ chừa lối thông ra cổng.", ["The teacher asked us", "to leave a clear", "route to the gate."]], ["We moved one table to the side so families could walk through while children carried their lanterns around the courtyard.", "Chúng tôi chuyển một chiếc bàn sang bên để các gia đình có thể đi qua trong lúc các em nhỏ rước đèn quanh sân.", ["We moved one table", "to the side", "so families could walk", "through while children", "carried their lanterns", "around the courtyard."]], ["At the end, we gave away some fruit and put everything away.", "Cuối buổi, chúng tôi chia bớt trái cây và dọn cất mọi thứ.", ["At the end,", "we gave away some", "fruit and", "put everything away."]]], "output": ["Which lantern shape would you make?", "Why should organisers test equipment early?", "What small job could a younger child do?", "Write 70–90 words describing how your class could prepare a small festival event."], "models": ["I would make a star because it is easy to recognise from far away. I would use orange paper.", "They can find problems before guests arrive. There is still time to replace a broken light.", "A younger child could help sort paper by colour. An older student could cut the paper when needed."], "drills": [["Our class plans to ________ for the festival.", "make paper lanterns"], ["We ________ in a dark room before the event.", "tested the lights"], ["Can you help me ________ before the guests arrive?", "arrange a fruit tray"], ["The children ________ through the courtyard.", "carried their lanterns"], ["After the event, we need to ________.", "put everything away"]]}, {"id": 24, "ch": 5, "title": "After the Festival", "genre": "Interview", "p": [{"en": "Reporter: Why did a group of volunteers come back to the courtyard this morning?\nNhi: We wanted to **clean up after the festival**. The courtyard is used again later today, so we agreed to meet early and clear the paths first.", "vi": "Phóng viên: Vì sao sáng nay một nhóm tình nguyện viên quay lại sân?\nNhi: Chúng mình muốn dọn dẹp sau lễ hội. Sân sẽ được sử dụng lại trong hôm nay nên cả nhóm hẹn đến sớm và dọn các lối đi trước."}, {"en": "Reporter: How did you organise the work?\nNhi: We made three teams. One team took down the **decorations**. Another team helped **sort the rubbish** into different bins. The last team swept the steps and checked around the seats.", "vi": "Phóng viên: Các bạn tổ chức công việc thế nào?\nNhi: Chúng mình chia thành ba nhóm. Một nhóm tháo đồ trang trí. Một nhóm giúp phân loại rác vào các thùng khác nhau. Nhóm cuối quét bậc thang và kiểm tra quanh các ghế ngồi."}, {"en": "Reporter: Did you **save any decorations**?\nNhi: Yes. There were several **flags** that we could use again. We folded them and put them into a dry box. We made a note of what was inside so the next group could find them easily.", "vi": "Phóng viên: Các bạn có giữ lại đồ trang trí nào không?\nNhi: Có. Có vài lá cờ có thể dùng lại. Chúng mình gấp và đặt vào một chiếc hộp khô. Cả nhóm ghi lại những gì có bên trong để nhóm sau dễ tìm."}, {"en": "Reporter: What would you change next time?\nNhi: We’ll **put bins near the exits** before the event and add simple signs. It will be easier for visitors to **leave the place tidy** if they know where everything goes.", "vi": "Phóng viên: Lần sau các bạn sẽ thay đổi điều gì?\nNhi: Chúng mình sẽ đặt thùng rác gần lối ra trước sự kiện và gắn biển chỉ dẫn đơn giản. Khách sẽ dễ giữ nơi đó gọn gàng khi rời đi nếu biết bỏ từng thứ vào đâu."}], "v": [{"en": "clean up after the festival", "vi": "dọn dẹp sau lễ hội", "kind": "colloc", "context": "Reporter: Why did a group of volunteers come back to the courtyard this morning?\nNhi: We wanted to clean up after the festival. The courtyard is used again later today, so we agreed to meet early and clear the paths first.", "contextvi": "Phóng viên: Vì sao sáng nay một nhóm tình nguyện viên quay lại sân?\nNhi: Chúng mình muốn dọn dẹp sau lễ hội. Sân sẽ được sử dụng lại trong hôm nay nên cả nhóm hẹn đến sớm và dọn các lối đi trước.", "example": "The volunteers stayed to clean up after the festival.", "examplevi": "Các tình nguyện viên ở lại dọn dẹp sau lễ hội."}, {"en": "sort the rubbish", "vi": "phân loại rác", "kind": "colloc", "context": "Reporter: How did you organise the work?\nNhi: We made three teams. One team took down the decorations. Another team helped sort the rubbish into different bins. The last team swept the steps and checked around the seats.", "contextvi": "Phóng viên: Các bạn tổ chức công việc thế nào?\nNhi: Chúng mình chia thành ba nhóm. Một nhóm tháo đồ trang trí. Một nhóm giúp phân loại rác vào các thùng khác nhau. Nhóm cuối quét bậc thang và kiểm tra quanh các ghế ngồi.", "example": "Please sort the rubbish before you take it outside.", "examplevi": "Vui lòng phân loại rác trước khi mang ra ngoài."}, {"en": "save any decorations", "vi": "giữ lại đồ trang trí nào", "kind": "colloc", "context": "Reporter: Did you save any decorations?\nNhi: Yes. There were several flags that we could use again. We folded them and put them into a dry box. We made a note of what was inside so the next group could find them easily.", "contextvi": "Phóng viên: Các bạn có giữ lại đồ trang trí nào không?\nNhi: Có. Có vài lá cờ có thể dùng lại. Chúng mình gấp và đặt vào một chiếc hộp khô. Cả nhóm ghi lại những gì có bên trong để nhóm sau dễ tìm.", "example": "Did you save any decorations for next year?", "examplevi": "Bạn có giữ lại đồ trang trí nào cho năm sau không?"}, {"en": "put bins near the exits", "vi": "đặt thùng rác gần lối ra", "kind": "colloc", "context": "Reporter: What would you change next time?\nNhi: We’ll put bins near the exits before the event and add simple signs. It will be easier for visitors to leave the place tidy if they know where everything goes.", "contextvi": "Phóng viên: Lần sau các bạn sẽ thay đổi điều gì?\nNhi: Chúng mình sẽ đặt thùng rác gần lối ra trước sự kiện và gắn biển chỉ dẫn đơn giản. Khách sẽ dễ giữ nơi đó gọn gàng khi rời đi nếu biết bỏ từng thứ vào đâu.", "example": "It would help to put bins near the exits before the doors open.", "examplevi": "Đặt thùng rác gần lối ra trước khi mở cửa sẽ có ích."}, {"en": "leave the place tidy", "vi": "giữ nơi đó gọn gàng khi rời đi", "kind": "colloc", "context": "Reporter: What would you change next time?\nNhi: We’ll put bins near the exits before the event and add simple signs. It will be easier for visitors to leave the place tidy if they know where everything goes.", "contextvi": "Phóng viên: Lần sau các bạn sẽ thay đổi điều gì?\nNhi: Chúng mình sẽ đặt thùng rác gần lối ra trước sự kiện và gắn biển chỉ dẫn đơn giản. Khách sẽ dễ giữ nơi đó gọn gàng khi rời đi nếu biết bỏ từng thứ vào đâu.", "example": "Please leave the place tidy when you go home.", "examplevi": "Vui lòng giữ nơi đó gọn gàng khi rời đi."}, {"en": "decorations", "vi": "đồ trang trí", "kind": "vocab", "context": "Reporter: How did you organise the work?\nNhi: We made three teams. One team took down the decorations. Another team helped sort the rubbish into different bins. The last team swept the steps and checked around the seats.", "contextvi": "Phóng viên: Các bạn tổ chức công việc thế nào?\nNhi: Chúng mình chia thành ba nhóm. Một nhóm tháo đồ trang trí. Một nhóm giúp phân loại rác vào các thùng khác nhau. Nhóm cuối quét bậc thang và kiểm tra quanh các ghế ngồi.", "example": "The school stored its decorations in boxes.", "examplevi": "Trường cất đồ trang trí trong các hộp."}, {"en": "flags", "vi": "lá cờ", "kind": "vocab", "context": "Reporter: Did you save any decorations?\nNhi: Yes. There were several flags that we could use again. We folded them and put them into a dry box. We made a note of what was inside so the next group could find them easily.", "contextvi": "Phóng viên: Các bạn có giữ lại đồ trang trí nào không?\nNhi: Có. Có vài lá cờ có thể dùng lại. Chúng mình gấp và đặt vào một chiếc hộp khô. Cả nhóm ghi lại những gì có bên trong để nhóm sau dễ tìm.", "example": "We folded the flags after the festival.", "examplevi": "Chúng tôi gấp các lá cờ sau lễ hội."}], "image": "data:image/webp;base64,UklGRjCJAABXRUJQVlA4ICSJAAAQVQGdASo+AT0BPkEaikMioaEY2wcMKAQEszLFZqv0RWp694W7/7f/Jfun/ePdP5H6/va33r9ie1T6AO+733/f+W30N/yv8p+VPza/4Hq+/rH+x/8PuE/0r+6/9j/K+vF+2PvH/db1Gf2L/U/tn7tf/P/br3jf2X/Xftz/hfkN/pH+J/8vtg+rJ/l//R7FP7e//j15/3T+H3+4f9L93far//GD/cQ/zf5GeZf5J9C/lf7n+6H999tD/V7yvqv8t/3f8l/p/YP+Yffv9v/hv3c/y3ub/vv9V+WHpX8bf9H/B+wR+Vf0v/Xf3n13vqf/J/rO8z3v/Rf9r/JewR7c/Z/+P/kPy1+Bv6f/s/5b1N/Xv8f/2v9B8AX87/rX/J/wv74f5/5X/73hlfe/+z7An9e/zH/g/zn+j/aT6cf8X/6f7n/hfvR7rf17/Xf+z/W/Aj/SP8J/3P8x/pO616XhcNe2CK4yVxTtCRaUuyb3hAWHMYPlD8OW4r7Gy2Ygya3s+Nms7YQj41pdM6Ud7NSjj0IoArE4iGql8WlREDQJNzbpdDMkS35P0xbX3lW6sP6vsbu0NAWnHtn0R2/tix5ZR34m2TaanXUNfgcecszODaDCo+NnmoGQ/tbDl3UktlidcQ+ch6sz/S5gTivfxwYmLGKGOq/tpQLquc78Z6qQ6tt3F+94M9blQBw4cjm2+zbS7lVN2e80FijyKUoaCOW8NGu4dR6fr8c7dvGdro6V7SXOiPV9/8XBLrUAZMya/OUMr3MXutrJ5aOs619WZuyTsgKIjdzi5Vv9v2vy8xshC8IM16lJEDpqLJyqdP0OY6CETX1oTDv8yz7FXo2zqyB7PVB17Bozz0X4FRfqc27xLHoqy/y7t5NcPqXTnvgjLZ8k6BeWnM/UGTaD3sFOC95H/tlp/II8jGaf5zguyGiMUGRhCIBAXAjQ3yoe09b1vmf9FarFxIYeUUeDekmWEePx1gLLPhQtUazee7CMsXx3C87cCq4Do5WZBi10pDS07yRcXcA84OYawz2OQ648Os0YeqfQ28k8ewVDz4ocLvRt63EQYT/9+gJvS6CF/RDffVcMNwne6X39Eddff4yXXLgIEtw/SW7FTAmGREJpBd/6s5teODwPQZ0kLF5FY+WqILN36QoZhJjJ4wSGy20bZ+c7F2adOfIoZJVaBIaqi+o+bxAVO8/pyoI32pqRy3mmiW se the courtyard all day", "Ask visitors to take the decorations home"]], "gr": [["One group put the flags into ________ dry box.", "a", "an", "Ø"], ["The team swept ________ steps leading to the main entrance.", "the", "an", "a"]], "wf": [["volunteer", "volunteers", "A group of ________ arrived early to help."], ["organise", "organisers", "The event ________ put bins by the exits."]], "chunks": [["Why did a group of volunteers come back to the courtyard this morning?", "Vì sao sáng nay một nhóm tình nguyện viên quay lại sân?", ["Why did a group", "of volunteers come back", "to the courtyard this morning?"]], ["The courtyard is used again later today, so we agreed to meet early and clear the paths first.", "Sân sẽ được sử dụng lại trong hôm nay nên cả nhóm hẹn đến sớm và dọn các lối đi trước.", ["The courtyard is used", "again later today,", "so we agreed to", "meet early", "and clear the paths first."]], ["Another team helped sort the rubbish into different bins.", "Một nhóm giúp phân loại rác vào các thùng khác nhau.", ["Another team helped", "sort the rubbish", "into different bins."]], ["The last team swept the steps and checked around the seats.", "Nhóm cuối quét bậc thang và kiểm tra quanh các ghế ngồi.", ["The last team swept", "the steps", "and checked around the seats."]], ["We folded them and put them into a dry box.", "Chúng mình gấp và đặt vào một chiếc hộp khô.", ["We folded them", "and put them into", "a dry box."]], ["We made a note of what was inside so the next group could find them easily.", "Cả nhóm ghi lại những gì có bên trong để nhóm sau dễ tìm.", ["We made a note", "of what was inside", "so the next group", "could find them easily."]], ["We’ll put bins near the exits before the event and add simple signs.", "Chúng mình sẽ đặt thùng rác gần lối ra trước sự kiện và gắn biển chỉ dẫn đơn giản.", ["We’ll", "put bins near the exits", "before the event", "and add simple signs."]], ["It will be easier for visitors to leave the place tidy if they know where everything goes.", "Khách sẽ dễ giữ nơi đó gọn gàng khi rời đi nếu biết bỏ từng thứ vào đâu.", ["It will be easier", "for visitors to", "leave the place tidy", "if they know", "where everything goes."]]], "output": ["Which clean-up job would you choose?", "How can signs make events easier to manage?", "Which festival items can be used again?", "Write 70–90 words proposing a clean-up plan for a school event."], "models": ["I would sort the rubbish because it is a clear task. I would ask where to put any items I did not recognise.", "A simple sign tells people what to do quickly. It can show which bin to use without a long explanation.", "Flags, boxes and signs can often be used again. We should store them somewhere clean and dry."], "drills": [["The volunteers stayed to ________.", "clean up after the festival"], ["Please ________ before you take it outside.", "sort the rubbish"], ["Did you ________ for next year?", "save any decorations"], ["It would help to ________ before the doors open.", "put bins near the exits"], ["Please ________ when you go home.", "leave the place tidy"]]}, {"id": 25, "ch": 5, "title": "One Custom, Two Generations", "genre": "Family Story", "p": [{"en": "After dinner on a special family day, Minh’s grandmother opened an old **album**. She pointed to a photograph of the village path that her family used to walk along. They followed it to **visit a neighbour** and share homemade food on that day each year.", "vi": "Sau bữa tối trong một dịp đặc biệt của gia đình, bà Minh mở một cuốn album cũ. Bà chỉ một bức ảnh chụp con đường làng mà gia đình bà từng đi. Mỗi năm vào ngày đó, họ đi theo con đường ấy để thăm hàng xóm và chia sẻ món ăn tự làm."}, {"en": "Minh lives far from most of his relatives, so visiting everyone on the same day is difficult. He suggested that they **make a video call** after dinner. His grandmother liked the idea but also wanted to send something they could hold.", "vi": "Minh sống xa phần lớn họ hàng nên việc thăm tất cả mọi người trong cùng một ngày rất khó. Em đề nghị gọi video sau bữa tối. Bà thích ý tưởng đó nhưng cũng muốn gửi một thứ mọi người có thể cầm trên tay."}, {"en": "Together they decided to **write a short card** and put it in the post. Minh read the card **aloud** during the call. His aunt asked him to **tell the story again** for his younger cousin, who had never heard about the village path.", "vi": "Hai bà cháu quyết định viết một tấm thiệp ngắn và gửi qua bưu điện. Minh đọc to tấm thiệp trong cuộc gọi. Dì nhờ em kể lại câu chuyện cho một em họ nhỏ tuổi chưa từng nghe về con đường làng."}, {"en": "The next year, his cousin sent a card of her own. Minh kept it in the album beside the photograph. The family had found a new way to **stay in touch**, and the story of the old visit had become part of it.", "vi": "Năm sau, em họ gửi một tấm thiệp do em tự viết. Minh cất tấm thiệp trong cuốn album cạnh bức ảnh. Gia đình đã tìm được một cách mới để giữ liên lạc, và câu chuyện về chuyến thăm ngày trước trở thành một phần của cách đó."}], "v": [{"en": "visit a neighbour", "vi": "thăm hàng xóm", "kind": "colloc", "context": "After dinner on a special family day, Minh’s grandmother opened an old album. She pointed to a photograph of the village path that her family used to walk along. They followed it to visit a neighbour and share homemade food on that day each year.", "contextvi": "Sau bữa tối trong một dịp đặc biệt của gia đình, bà Minh mở một cuốn album cũ. Bà chỉ một bức ảnh chụp con đường làng mà gia đình bà từng đi. Mỗi năm vào ngày đó, họ đi theo con đường ấy để thăm hàng xóm và chia sẻ món ăn tự làm.", "example": "We took some cakes with us when we went to visit a neighbour.", "examplevi": "Chúng tôi mang theo vài chiếc bánh khi đi thăm hàng xóm."}, {"en": "make a video call", "vi": "gọi video", "kind": "colloc", "context": "Minh lives far from most of his relatives, so visiting everyone on the same day is difficult. He suggested that they make a video call after dinner. His grandmother liked the idea but also wanted to send something they could hold.", "contextvi": "Minh sống xa phần lớn họ hàng nên việc thăm tất cả mọi người trong cùng một ngày rất khó. Em đề nghị gọi video sau bữa tối. Bà thích ý tưởng đó nhưng cũng muốn gửi một thứ mọi người có thể cầm trên tay.", "example": "Can we make a video call after dinner tonight?", "examplevi": "Tối nay mình gọi video sau bữa tối được không?"}, {"en": "write a short card", "vi": "viết một tấm thiệp ngắn", "kind": "colloc", "context": "Together they decided to write a short card and put it in the post. Minh read the card aloud during the call. His aunt asked him to tell the story again for his younger cousin, who had never heard about the village path.", "contextvi": "Hai bà cháu quyết định viết một tấm thiệp ngắn và gửi qua bưu điện. Minh đọc to tấm thiệp trong cuộc gọi. Dì nhờ em kể lại câu chuyện cho một em họ nhỏ tuổi chưa từng nghe về con đường làng.", "example": "Let’s write a short card and send it to our aunt.", "examplevi": "Hãy viết một tấm thiệp ngắn rồi gửi cho dì."}, {"en": "tell the story again", "vi": "kể lại câu chuyện", "kind": "colloc", "context": "Together they decided to write a short card and put it in the post. Minh read the card aloud during the call. His aunt asked him to tell the story again for his younger cousin, who had never heard about the village path.", "contextvi": "Hai bà cháu quyết định viết một tấm thiệp ngắn và gửi qua bưu điện. Minh đọc to tấm thiệp trong cuộc gọi. Dì nhờ em kể lại câu chuyện cho một em họ nhỏ tuổi chưa từng nghe về con đường làng.", "example": "My little brother asked me to tell the story again.", "examplevi": "Em trai tôi nhờ tôi kể lại câu chuyện."}, {"en": "stay in touch", "vi": "giữ liên lạc", "kind": "colloc", "context": "The next year, his cousin sent a card of her own. Minh kept it in the album beside the photograph. The family had found a new way to stay in touch, and the story of the old visit had become part of it.", "contextvi": "Năm sau, em họ gửi một tấm thiệp do em tự viết. Minh cất tấm thiệp trong cuốn album cạnh bức ảnh. Gia đình đã tìm được một cách mới để giữ liên lạc, và câu chuyện về chuyến thăm ngày trước trở thành một phần của cách đó.", "example": "Letters and phone calls help us stay in touch.", "examplevi": "Thư và các cuộc gọi giúp chúng tôi giữ liên lạc."}, {"en": "album", "vi": "cuốn album", "kind": "vocab", "context": "After dinner on a special family day, Minh’s grandmother opened an old album. She pointed to a photograph of the village path that her family used to walk along. They followed it to visit a neighbour and share homemade food on that day each year.", "contextvi": "Sau bữa tối trong một dịp đặc biệt của gia đình, bà Minh mở một cuốn album cũ. Bà chỉ một bức ảnh chụp con đường làng mà gia đình bà từng đi. Mỗi năm vào ngày đó, họ đi theo con đường ấy để thăm hàng xóm và chia sẻ món ăn tự làm.", "example": "She opened an album of old photographs.", "examplevi": "Bà mở một cuốn album ảnh cũ."}, {"en": "aloud", "vi": "thành tiếng", "kind": "vocab", "context": "Together they decided to write a short card and put it in the post. Minh read the card aloud during the call. His aunt asked him to tell the story again for his younger cousin, who had never heard about the village path.", "contextvi": "Hai bà cháu quyết định viết một tấm thiệp ngắn và gửi qua bưu điện. Minh đọc to tấm thiệp trong cuộc gọi. Dì nhờ em kể lại câu chuyện cho một em họ nhỏ tuổi chưa từng nghe về con đường làng.", "example": "Minh read his card aloud.", "examplevi": "Minh đọc thành tiếng tấm thiệp của mình."}], "image": "data:image/webp;base64,UklGRlRaAABXRUJQVlA4IEhaAABwKgGdASo+AT0BPkUejEQioaETWg68KAREoAv649Vx9d++v6/+a9Gjl/vJ+r/g/8t7+P97qB+Y8er4Lvcf7P9t/d9/Tf8v/7PcN8yH/V9d/9y/6fqn/p3+2/aT3svS7/oPUa/yvp4er56L3nL//P94viJ/tf/j/dj24+v35l+Ejy1/k+Dv5r9h/tvWvvD/BeBH9D/S/9b1g/1vgT8rP97/F+wp+Yf0r/d/331u/tO6027/V/+7/Z+xH70/cP+3/jvaD+689f6T90/cH/NvkgPW/YN/UX7M+0bp3exP/n/tfgY/ovVgNshL0QQDR2a , "visit a neighbour", "and share homemade food", "on that day each year."]], ["Minh lives far from most of his relatives, so visiting everyone on the same day is difficult.", "Minh sống xa phần lớn họ hàng nên việc thăm tất cả mọi người trong cùng một ngày rất khó.", ["Minh lives far", "from most of his", "relatives, so visiting everyone", "on the same day", "is difficult."]], ["He suggested that they make a video call after dinner.", "Em đề nghị gọi video sau bữa tối.", ["He suggested that they", "make a video call", "after dinner."]], ["His grandmother liked the idea but also wanted to send something they could hold.", "Bà thích ý tưởng đó nhưng cũng muốn gửi một thứ mọi người có thể cầm trên tay.", ["His grandmother liked the", "idea but also wanted", "to send something they", "could hold."]], ["Together they decided to write a short card and put it in the post.", "Hai bà cháu quyết định viết một tấm thiệp ngắn và gửi qua bưu điện.", ["Together they decided to", "write a short card", "and put it", "in the post."]], ["His aunt asked him to tell the story again for his younger cousin, who had never heard about the village path.", "Dì nhờ em kể lại câu chuyện cho một em họ nhỏ tuổi chưa từng nghe về con đường làng.", ["His aunt asked him", "to", "tell the story again", "for his younger cousin,", "who had never heard", "about the village path."]]], "output": ["How do you stay in touch with distant relatives?", "What family story would you tell a younger cousin?", "How can a family custom change over time?", "Write 70–90 words about a tradition you could adapt when family members live in different places."], "models": ["I send messages during the week and make a video call on special days. I also like receiving handwritten cards.", "I would tell the story of how my grandparents walked to the market. It shows how life was different for them.", "A family can keep the main idea and change how they do it. For example, a video call can help people share a story when they live far away."], "drills": [["We took some cakes with us when we went to ________.", "visit a neighbour"], ["Can we ________ after dinner tonight?", "make a video call"], ["Let’s ________ and send it to our aunt.", "write a short card"], ["My little brother asked me to ________.", "tell the story again"], ["Letters and phone calls help us ________.", "stay in touch"]]}, {"id": 26, "ch": 6, "title": "Two Wheels to School", "genre": "Personal Experience", "p": [{"en": "Hoa usually goes to school by bus. This term, she and her friend An decided to **cycle to school** once a week. They chose Wednesday, when their schoolbags are lighter. Hoa’s father offered to practise the **route** with them first.", "vi": "Hoa thường đi học bằng xe buýt. Học kỳ này, em và bạn An quyết định đạp xe đến trường mỗi tuần một lần. Hai bạn chọn thứ Tư, ngày cặp sách nhẹ hơn. Bố Hoa đề nghị đi thử tuyến đường cùng hai bạn trước."}, {"en": "They found a quiet street that ran behind the library. The route was a little longer, but it helped them **avoid heavy traffic**. At a difficult crossing, they agreed to **get off their bikes** and walk across when it was safe.", "vi": "Hai bạn tìm thấy một con đường yên tĩnh chạy phía sau thư viện. Đường hơi dài hơn nhưng giúp tránh đoạn đông xe. Tại một chỗ sang đường khó, hai bạn thống nhất xuống xe đạp và dắt bộ qua khi an toàn."}, {"en": "“If it rains tomorrow, we’ll take the bus,” An said. The sky was clear in the morning, so they checked their **tyres** and set off early. When they reached the school gate, they had enough time to **park their bikes** and get a drink.", "vi": "“Nếu mai trời mưa, chúng mình sẽ đi xe buýt,” An nói. Sáng hôm sau trời quang nên hai bạn kiểm tra lốp rồi khởi hành sớm. Khi đến cổng trường, hai bạn có đủ thời gian dựng xe và uống nước."}, {"en": "Hoa wants to **keep the routine** for a month before adding a second cycling day. She likes having a plan that works in good weather and an easy alternative for rainy mornings.", "vi": "Hoa muốn duy trì thói quen này một tháng trước khi đạp xe thêm một ngày nữa trong tuần. Em thích có một kế hoạch phù hợp khi trời đẹp và một phương án đơn giản cho những buổi sáng mưa."}], "v": [{"en": "cycle to school", "vi": "đạp xe đến trường", "kind": "colloc", "context": "Hoa usually goes to school by bus. This term, she and her friend An decided to cycle to school once a week. They chose Wednesday, when their schoolbags are lighter. Hoa’s father offered to practise the route with them first.", "contextvi": "Hoa thường đi học bằng xe buýt. Học kỳ này, em và bạn An quyết định đạp xe đến trường mỗi tuần một lần. Hai bạn chọn thứ Tư, ngày cặp sách nhẹ hơn. Bố Hoa đề nghị đi thử tuyến đường cùng hai bạn trước.", "example": "We decided to cycle to school once a week.", "examplevi": "Chúng tôi quyết định đạp xe đến trường mỗi tuần một lần."}, {"en": "avoid heavy traffic", "vi": "tránh đoạn đông xe", "kind": "colloc", "context": "They found a quiet street that ran behind the library. The route was a little longer, but it helped them avoid heavy traffic. At a difficult crossing, they agreed to get off their bikes and walk across when it was safe.", "contextvi": "Hai bạn tìm thấy một con đường yên tĩnh chạy phía sau thư viện. Đường hơi dài hơn nhưng giúp tránh đoạn đông xe. Tại một chỗ sang đường khó, hai bạn thống nhất xuống xe đạp và dắt bộ qua khi an toàn.", "example": "Leave a little earlier to avoid heavy traffic.", "examplevi": "Hãy khởi hành sớm hơn một chút để tránh đoạn đông xe."}, {"en": "get off their bikes", "vi": "xuống xe đạp", "kind": "colloc", "context": "They found a quiet street that ran behind the library. The route was a little longer, but it helped them avoid heavy traffic. At a difficult crossing, they agreed to get off their bikes and walk across when it was safe.", "contextvi": "Hai bạn tìm thấy một con đường yên tĩnh chạy phía sau thư viện. Đường hơi dài hơn nhưng giúp tránh đoạn đông xe. Tại một chỗ sang đường khó, hai bạn thống nhất xuống xe đạp và dắt bộ qua khi an toàn.", "example": "The students get off their bikes before crossing the busy road.", "examplevi": "Các em học sinh xuống xe đạp trước khi sang đường đông."}, {"en": "park their bikes", "vi": "dựng xe đạp", "kind": "colloc", "context": "“If it rains tomorrow, we’ll take the bus,” An said. The sky was clear in the morning, so they checked their tyres and set off early. When they reached the school gate, they had enough time to park their bikes and get a drink.", "contextvi": "“Nếu mai trời mưa, chúng mình sẽ đi xe buýt,” An nói. Sáng hôm sau trời quang nên hai bạn kiểm tra lốp rồi khởi hành sớm. Khi đến cổng trường, hai bạn có đủ thời gian dựng xe và uống nước.", "example": "There is a place to park their bikes near the library.", "examplevi": "Có chỗ dựng xe đạp gần thư viện."}, {"en": "keep the routine", "vi": "duy trì thói quen", "kind": "colloc", "context": "Hoa wants to keep the routine for a month before adding a second cycling day. She likes having a plan that works in good weather and an easy alternative for rainy mornings.", "contextvi": "Hoa muốn duy trì thói quen này một tháng trước khi đạp xe thêm một ngày nữa trong tuần. Em thích có một kế hoạch phù hợp khi trời đẹp và một phương án đơn giản cho những buổi sáng mưa.", "example": "Hoa hopes to keep the routine for a whole month.", "examplevi": "Hoa hy vọng duy trì thói quen suốt một tháng."}, {"en": "route", "vi": "tuyến đường", "kind": "vocab", "context": "Hoa usually goes to school by bus. This term, she and her friend An decided to cycle to school once a week. They chose Wednesday, when their schoolbags are lighter. Hoa’s father offered to practise the route with them first.", "contextvi": "Hoa thường đi học bằng xe buýt. Học kỳ này, em và bạn An quyết định đạp xe đến trường mỗi tuần một lần. Hai bạn chọn thứ Tư, ngày cặp sách nhẹ hơn. Bố Hoa đề nghị đi thử tuyến đường cùng hai bạn trước.", "example": "This route goes past the library.", "examplevi": "Tuyến đường này đi qu he was reading messages while his sister was telling a story. He had to ask her to start again. After dinner, the family agreed to try a **phone-free meal** the following evening.", "vi": "Một buổi tối, Nam nhận ra mình đang đọc tin nhắn trong khi em gái kể chuyện. Cậu phải nhờ em kể lại từ đầu. Sau bữa tối, cả nhà thống nhất thử dùng một bữa không điện thoại vào tối hôm sau."}, {"en": "They put a small box on a shelf near the table. Everyone could **put their phones away** before sitting down. Nam left his phone on **silent** because a group chat often sent several messages at the same time.", "vi": "Họ đặt một chiếc hộp nhỏ trên kệ gần bàn. Mọi người có thể cất điện thoại trước khi ngồi ăn. Nam để điện thoại ở chế độ im lặng vì một nhóm chat thường gửi nhiều tin nhắn cùng lúc."}, {"en": "At first, the meal felt quieter than usual. Then his mother asked each person to **share one good thing** about their day. Nam listened to his sister’s story all the way through. He found it easier to **pay attention** when he could not see his screen.", "vi": "Ban đầu, bữa ăn có vẻ yên hơn thường lệ. Sau đó, mẹ mời mỗi người chia sẻ một điều tốt đẹp trong ngày. Nam nghe em gái kể chuyện từ đầu đến cuối. Cậu thấy dễ tập trung hơn khi không nhìn thấy màn hình."}, {"en": "“If this works for everyone, we’ll do it again next Friday,” his father said. They decided to **agree on an exception** for anyone expecting an **urgent** call. Nam liked the idea because the family could adjust the plan when necessary.", "vi": "“Nếu mọi người thấy cách này phù hợp, thứ Sáu tới nhà mình sẽ làm lại,” bố nói. Cả nhà thống nhất một ngoại lệ cho người đang chờ cuộc gọi khẩn. Nam thích ý tưởng đó vì gia đình có thể điều chỉnh kế hoạch khi cần."}], "v": [{"en": "phone-free meal", "vi": "bữa ăn không dùng điện thoại", "kind": "colloc", "context": "One evening, Nam noticed that he was reading messages while his sister was telling a story. He had to ask her to start again. After dinner, the family agreed to try a phone-free meal the following evening.", "contextvi": "Một buổi tối, Nam nhận ra mình đang đọc tin nhắn trong khi em gái kể chuyện. Cậu phải nhờ em kể lại từ đầu. Sau bữa tối, cả nhà thống nhất thử dùng một bữa không điện thoại vào tối hôm sau.", "example": "We tried a phone-free meal on Friday night.", "examplevi": "Chúng tôi thử dùng một bữa ăn không điện thoại vào tối thứ Sáu."}, {"en": "put their phones away", "vi": "cất điện thoại", "kind": "colloc", "context": "They put a small box on a shelf near the table. Everyone could put their phones away before sitting down. Nam left his phone on silent because a group chat often sent several messages at the same time.", "contextvi": "Họ đặt một chiếc hộp nhỏ trên kệ gần bàn. Mọi người có thể cất điện thoại trước khi ngồi ăn. Nam để điện thoại ở chế độ im lặng vì một nhóm chat thường gửi nhiều tin nhắn cùng lúc.", "example": "I asked the players to put their phones away before the team talk.", "examplevi": "Tôi đề nghị các cầu thủ cất điện thoại trước buổi trao đổi của đội."}, {"en": "share one good thing", "vi": "chia sẻ một điều tốt đẹp", "kind": "colloc", "context": "At first, the meal felt quieter than usual. Then his mother asked each person to share one good thing about their day. Nam listened to his sister’s story all the way through. He found it easier to pay attention when he could not see his screen.", "contextvi": "Ban đầu, bữa ăn có vẻ yên hơn thường lệ. Sau đó, mẹ mời mỗi người chia sẻ một điều tốt đẹp trong ngày. Nam nghe em gái kể chuyện từ đầu đến cuối. Cậu thấy dễ tập trung hơn khi không nhìn thấy màn hình.", "example": "Let’s share one good thing that happened today.", "examplevi": "Hãy chia sẻ một điều tốt đẹp đã xảy ra hôm nay."}, {"en": "pay attention", "vi": "chú ý, tập trung", "kind": "colloc", "context": "At first, the meal felt quieter than usual. Then his mother asked each person to share one good thing about their day. Nam listened to his sister’s story all the way through. He found it nt several messages at the same time.", "Nam để điện thoại ở chế độ im lặng vì một nhóm chat thường gửi nhiều tin nhắn cùng lúc.", ["Nam left his phone", "on silent", "because a group chat", "often sent several messages", "at the same time."]], ["At first, the meal felt quieter than usual.", "Ban đầu, bữa ăn có vẻ yên hơn thường lệ.", ["At first,", "the meal felt quieter", "than usual."]], ["Then his mother asked each person to share one good thing about their day.", "Sau đó, mẹ mời mỗi người chia sẻ một điều tốt đẹp trong ngày.", ["Then his mother asked", "each person to", "share one good thing", "about their day."]], ["Nam listened to his sister’s story all the way through.", "Nam nghe em gái kể chuyện từ đầu đến cuối.", ["Nam listened to his", "sister’s story all the", "way through."]]], "output": ["When is it easy to get distracted by a phone?", "What device rule would you try at home?", "When might a family need an exception?", "Write 70–90 words suggesting one rule for using phones at home. Explain why it might help and give one exception."], "models": ["I get distracted when a message appears while I am talking to someone. I can put my phone away until the conversation ends.", "I would try keeping phones off the table during dinner. If everyone likes it, we will do it twice a week.", "Someone might be waiting for an important call. The family can decide how to handle that before the meal starts."], "drills": [["We tried a ________ on Friday night.", "phone-free meal"], ["I asked the players to ________ before the team talk.", "put their phones away"], ["Let’s ________ that happened today.", "share one good thing"], ["A quiet space can help you ________.", "pay attention"], ["The group may ________ for emergencies.", "agree on an exception"]]}, {"id": 28, "ch": 6, "title": "A Bag to Bring Again", "genre": "Personal Experience", "p": [{"en": "On Saturday, my cousin Huy and I went to the market with a short list. Our aunt told us to **bring a reusable bag**. Huy put one in his pocket, and I brought a second bag in case we bought more than expected.", "vi": "Thứ Bảy, tôi và anh họ Huy đi chợ với một danh sách ngắn. Dì dặn chúng tôi mang theo túi dùng lại được. Huy bỏ một chiếc vào túi áo, còn tôi mang thêm chiếc thứ hai phòng khi mua nhiều hơn dự kiến."}, {"en": "At the first **stall**, we bought tomatoes and asked the seller to **skip the plastic bag**. We put the tomatoes in the smaller cloth bag, where they would not be **crushed** by heavier vegetables.", "vi": "Ở quầy đầu tiên, chúng tôi mua cà chua và nhờ người bán không dùng túi nilon. Chúng tôi để cà chua vào túi vải nhỏ hơn để rau củ nặng không đè nát chúng."}, {"en": "We nearly forgot the last item. Huy wanted to buy a large bunch of bananas, but we checked the list and decided to **buy only what we needed**. Our aunt already had fruit at home. On the way back, the bags were light enough to carry easily.", "vi": "Chúng tôi suýt quên món cuối. Huy muốn mua một nải chuối lớn, nhưng hai anh em xem lại danh sách và quyết định chỉ mua những gì cần. Ở nhà dì đã có trái cây. Trên đường về, các túi đủ nhẹ để xách dễ dàng."}, {"en": "We hung the empty bags by the door to **remember them next time**. “If we leave them there, we’ll see them before we go out,” Huy said. It was a simple change that might help us **cut down on waste**.", "vi": "Chúng tôi treo túi rỗng cạnh cửa để lần sau nhớ mang. “Nếu để ở đó, mình sẽ nhìn thấy trước khi đi ra ngoài,” Huy nói. Đó là một thay đổi đơn giản có thể giúp giảm rác thải."}], "v": [{"en": "bring a reusable bag", "vi": "mang theo túi dùng lại được", "kind": "colloc", "context": "On Saturday, my cousin Huy and I went to the market with a short list. Our aunt told us to bring a reusable bag. Huy put one in his pocket, and I brought a second bag in case we bought more than expected.", "contextvi": "Thứ Bảy, tôi và anh họ Huy đi chợ với một danh sách ngắn. Dì dặn chúng tôi mang theo túi dùng lại được. Huy bỏ một chiếc vào túi áo, còn tôi mang thêm chiếc thứ hai phòng khi mua nhiều hơn dự kiến.", "example": "Please bring a reusable bag when you go to the market.", "examplevi": "Hãy mang theo túi dùng lại được khi đi chợ."}, {"en": "skip the plastic bag", "vi": "không dùng túi nilon", "kind": "colloc", "context": "At the first stall, we bought tomatoes and asked the seller to skip the plastic bag. We put the tomatoes in the smaller cloth bag, where they would not be crushed by heavier vegetables.", "contextvi": "Ở quầy đầu tiên, chúng tôi mua cà chua và nhờ người bán không dùng túi nilon. Chúng tôi để cà chua vào túi vải nhỏ hơn để rau củ nặng không đè nát chúng.", "example": "You can skip the plastic bag if you have a cloth one.", "examplevi": "Bạn có thể không dùng túi nilon nếu đã có túi vải."}, {"en": "buy only what we needed", "vi": "chỉ mua những gì chúng tôi cần", "kind": "colloc", "context": "We nearly forgot the last item. Huy wanted to buy a large bunch of bananas, but we checked the list and decided to buy only what we needed. Our aunt already had fruit at home. On the way back, the bags were light enough to carry easily.", "contextvi": "Chúng tôi suýt quên món cuối. Huy muốn mua một nải chuối lớn, nhưng hai anh em xem lại danh sách và quyết định chỉ mua những gì cần. Ở nhà dì đã có trái cây. Trên đường về, các túi đủ nhẹ để xách dễ dàng.", "example": "The list helped us buy only what we needed.", "examplevi": "Danh sách giúp chúng tôi chỉ mua những gì cần."}, {"en": "remember them next time", "vi": "lần sau nhớ mang chúng", "kind": "colloc", "context": "We hung the empty bags by the door to remember them next time. “If we leave them there, we’ll see them before we go out,” Huy said. It was a simple change that might help us cut down on waste.", "contextvi": "Chúng tôi treo túi rỗng cạnh cửa để lần sau nhớ mang. “Nếu để ở đó, mình sẽ nhìn thấy trước khi đi ra ngoài,” Huy nói. Đó là một thay đổi đơn giản có thể giúp giảm rác thải.", "example": "We left the bags by the door to remember them next time.", "examplevi": "Chúng tôi để túi cạnh cửa để lần sau nhớ mang."}, {"en": "cut down on waste", "vi": "giảm rác thải", "kind": "colloc", "context": "We hung the empty bags by the door to remember them next time. “If we leave them there, we’ll see them before we go out,” Huy said. It was a simple change that might help us cut down on waste.", "contextvi": "Chúng tôi treo túi rỗng cạnh cửa để lần sau nhớ mang. “Nếu để ở đó, mình sẽ nhìn thấy trước khi đi ra ngoài,” Huy nói. Đó là một thay đổi đơn giản có thể giúp giảm rác thải.", "example": "Buying less packaging can help us cut down on waste.", "examplevi": "Mua đồ có ít bao bì hơn có thể giúp chúng ta giảm rác thải."}, {"en": "stall", "vi": "quầy hàng", "kind": "vocab", "context": "At the first stall, we bought tomatoes and asked the seller to skip the plastic bag. We put the tomatoes in the smaller cloth bag, where they would not be crushed by heavier vegetables.", "contextvi": "Ở quầy đầu tiên, chúng tôi mua cà chua và nhờ người bán không dùng túi nilon. Chúng tôi để cà chua vào túi vải nhỏ hơn để rau củ nặng không đè nát chúng.", "example": "The fruit stall is near the entrance.", "examplevi": "Quầy trái cây nằm gần lối vào."}, {"en": "crushed", "vi": "bị đè nát", "kind": "vocab", "context": "At the first stall, we bought tomatoes and asked the seller to skip the plastic bag. We put the tomatoes in the smaller cloth bag, where they would not be crushed by heavier vegetables.", "contextvi": "Ở quầy đầu tiên, chúng tôi mua cà chua và nhờ người bán không dùng túi nilon. Chúng tôi để cà chua vào túi vải nhỏ hơn để rau củ nặng không đè nát chúng.", "example": "The tomatoes were crushed at the bottom of the bag.", "examplevi": "Cà chua bị đè nát ở đáy túi."}], "image": "data:image/webp;base64,UklGRtZMAABXRUJQVlA4IMpMAADwzwCdASo9AakAPkEYiUMioaEZK57gKAQEsgBZ3LxpX7Jdankvy8/uH7JfKLyH2bfDPuP7W9qfUr2J5aPUvnj/5H4efEP+nf5z/w+43+vn67ddH90vyA+Bv9V/1H7Re7n/5vWb/dPUG/tH/F9cf1Y/Qz8u792vhj/s3/W/bn4GP3D///ZyadTun+r/k/5j/kfz7+N AyEqvCw0I0ggAAA==", "imageAlt": "Reusable cloth bag and vegetables", "mc": [["Why did the narrator take a second bag?", "In case they bought more than expected", "To give it to the seller", "Because Huy’s bag was broken"], ["Why did they avoid buying more fruit?", "There was fruit at home already", "They had spent all their money", "The fruit stall had closed"], ["Where did they put the empty bags?", "By the door", "Under the tomatoes", "In the market"]], "gr": [["If we leave the bags by the door, we ________ them before we go out.", "will see", "saw", "have seen"], ["If you ________ a cloth bag tomorrow, you won’t need a plastic one.", "bring", "will bring", "brought"]], "wf": [["use", "reusable", "A ________ bag can be taken to the market again."], ["pack", "packaging", "Some fruit is sold without plastic ________."]], "chunks": [["On Saturday, my cousin Huy and I went to the market with a short list.", "Thứ Bảy, tôi và anh họ Huy đi chợ với một danh sách ngắn.", ["On Saturday,", "my cousin Huy", "and I went to", "the market", "with a short list."]], ["Our aunt told us to bring a reusable bag.", "Dì dặn chúng tôi mang theo túi dùng lại được.", ["Our aunt told us", "to", "bring a reusable bag."]], ["Huy put one in his pocket, and I brought a second bag in case we bought more than expected.", "Huy bỏ một chiếc vào túi áo, còn tôi mang thêm chiếc thứ hai phòng khi mua nhiều hơn dự kiến.", ["Huy put one", "in his pocket,", "and I brought a", "second bag", "in case we bought", "more than expected."]], ["At the first stall, we bought tomatoes and asked the seller to skip the plastic bag.", "Ở quầy đầu tiên, chúng tôi mua cà chua và nhờ người bán không dùng túi nilon.", ["At the first stall,", "we bought tomatoes", "and asked the seller", "to", "skip the plastic bag."]], ["We put the tomatoes in the smaller cloth bag, where they would not be crushed by heavier vegetables.", "Chúng tôi để cà chua vào túi vải nhỏ hơn để rau củ nặng không đè nát chúng.", ["We put the tomatoes", "in the smaller cloth", "bag, where they would", "not be crushed", "by heavier vegetables."]], ["Huy wanted to buy a large bunch of bananas, but we checked the list and decided to buy only what we needed.", "Huy muốn mua một nải chuối lớn, nhưng hai anh em xem lại danh sách và quyết định chỉ mua những gì cần.", ["Huy wanted to buy", "a large bunch of", "bananas, but we checked", "the list", "and decided to", "buy only what we needed."]], ["On the way back, the bags were light enough to carry easily.", "Trên đường về, các túi đủ nhẹ để xách dễ dàng.", ["On the way back,", "the bags were light", "enough to carry easily."]], ["We hung the empty bags by the door to remember them next time.", "Chúng tôi treo túi rỗng cạnh cửa để lần sau nhớ mang.", ["We hung the empty", "bags by the door", "to", "remember them next time."]]], "output": ["What do you carry to the market?", "How does a list help when you shop?", "Where could you keep a reusable bag?", "Write 70–90 words about one shopping habit you would change to reduce waste."], "models": ["I carry a small cloth bag. If I plan to buy vegetables for several meals, I will take a bigger one too.", "It helps me remember the things I need. I am less likely to buy extra food I might not eat.", "I could keep one next to my shoes or in my schoolbag. It should be somewhere I see before I leave."], "drills": [["Please ________ when you go to the market.", "bring a reusable bag"], ["You can ________ if you have a cloth one.", "skip the plastic bag"], ["The list helped us ________.", "buy only what we needed"], ["We left the bags by the door to ________.", "remember them next time"], ["Buying less packaging can help us ________.", "cut down on waste"]]}, {"id": 29, "ch": 6, "title": "The Library Hour", "genre": "Interview", "p": [{"en": "Reporter: Why did you and Phúc decide to study at the library on Thursdays?\nYến: At home I sometimes start three tasks and finish none. We wanted a quiet place where we could **work without distractions** for one hour.", "vi": "Phóng viên: Vì sao bạn và Phúc quyết định học ở thư viện vào thứ Năm?\nYến: Ở nhà mình đôi khi bắt đầu ba việc mà chẳng xong việc nào. Chúng mình muốn một nơi yên tĩnh để học tập mà không bị xao nhãng trong một giờ."}, {"en": "Reporter: What do you do when you arrive?\nYến: We **set one clear goal** each. Last week, I wanted to finish a short report, and Phúc planned to correct five maths problems. Then we each worked on our own task.", "vi": "Phóng viên: Khi đến nơi, các bạn làm gì?\nYến: Mỗi bạn đặt ra một mục tiêu rõ ràng. Tuần trước, mình muốn hoàn thành một báo cáo ngắn, còn Phúc dự định sửa năm bài toán. Sau đó, mỗi người làm việc của mình."}, {"en": "Reporter: What happens if you get **stuck**?\nYến: If I cannot solve something, I’ll **write down a question** and move on. We **take a short break** **halfway** through. At the end, we look at our questions and help each other quietly.", "vi": "Phóng viên: Nếu gặp chỗ vướng thì sao?\nYến: Nếu không giải quyết được việc gì, mình sẽ ghi lại câu hỏi rồi làm tiếp. Giữa buổi chúng mình nghỉ một lát. Cuối buổi, hai bạn xem lại các câu hỏi và khẽ trao đổi để giúp nhau."}, {"en": "Reporter: Will you both go again next week?\nYến: Yes. If the library is full, we’ll **find another quiet place**. A table at home can work when we agree on a time and put our phones away.", "vi": "Phóng viên: Tuần sau hai bạn sẽ lại đến chứ?\nYến: Có. Nếu thư viện hết chỗ, chúng mình sẽ tìm một nơi yên tĩnh khác. Một chiếc bàn ở nhà cũng có thể phù hợp nếu hai bạn thống nhất giờ và cất điện thoại."}], "v": [{"en": "work without distractions", "vi": "học tập mà không bị xao nhãng", "kind": "colloc", "context": "Reporter: Why did you and Phúc decide to study at the library on Thursdays?\nYến: At home I sometimes start three tasks and finish none. We wanted a quiet place where we could work without distractions for one hour.", "contextvi": "Phóng viên: Vì sao bạn và Phúc quyết định học ở thư viện vào thứ Năm?\nYến: Ở nhà mình đôi khi bắt đầu ba việc mà chẳng xong việc nào. Chúng mình muốn một nơi yên tĩnh để học tập mà không bị xao nhãng trong một giờ.", "example": "A quiet room helps me work without distractions.", "examplevi": "Một phòng yên tĩnh giúp tôi học tập mà không bị xao nhãng."}, {"en": "set one clear goal", "vi": "đặt ra một mục tiêu rõ ràng", "kind": "colloc", "context": "Reporter: What do you do when you arrive?\nYến: We set one clear goal each. Last week, I wanted to finish a short report, and Phúc planned to correct five maths problems. Then we each worked on our own task.", "contextvi": "Phóng viên: Khi đến nơi, các bạn làm gì?\nYến: Mỗi bạn đặt ra một mục tiêu rõ ràng. Tuần trước, mình muốn hoàn thành một báo cáo ngắn, còn Phúc dự định sửa năm bài toán. Sau đó, mỗi người làm việc của mình.", "example": "Before you begin, set one clear goal for the study session.", "examplevi": "Trước khi bắt đầu, hãy đặt ra một mục tiêu rõ ràng cho buổi học."}, {"en": "write down a question", "vi": "ghi lại một câu hỏi", "kind": "colloc", "context": "Reporter: What happens if you get stuck?\nYến: If I cannot solve something, I’ll write down a question and move on. We take a short break halfway through. At the end, we look at our questions and help each other quietly.", "contextvi": "Phóng viên: Nếu gặp chỗ vướng thì sao?\nYến: Nếu không giải quyết được việc gì, mình sẽ ghi lại câu hỏi rồi làm tiếp. Giữa buổi chúng mình nghỉ một lát. Cuối buổi, hai bạn xem lại các câu hỏi và khẽ trao đổi để giúp nhau.", "example": "If you get stuck, write down a question to ask later.", "examplevi": "Nếu gặp chỗ vướng, hãy ghi lại một câu hỏi để hỏi sau."}, {"en": "take a short break", "vi": "nghỉ một lát", "kind": "colloc", "context": "Reporter: What happens if you get stuck?\nYến: If I cannot solve something, I’ll write down a question and move on. We take a short break halfway through. At the end, we look at our questions and help each other quietly.", "contextvi": "Phóng viên: Nếu gặp chỗ vướng thì sao?\nYến: Nếu không giải quyết được việc gì, mình sẽ ghi lại câu hỏi rồi làm tiếp. Giữa buổi chúng mình nghỉ một lát. Cuối buổi, hai bạn xem lại các câu hỏi và khẽ trao đổi để giúp nhau.", "example": "Let’s take a short break before we check our work.", "examplevi": "Hãy nghỉ một lát trước khi kiểm tra bài."}, {"en": "find another quiet place", "vi": "tìm một nơi yên tĩnh khác", "kind": "colloc", "context": "Reporter: Will you both go again next week?\nYến: Yes. If the library is full, we’ll find another quiet place. A table at home can work when we agree on a time and put our phones away.", "contextvi": "Phóng viên: Tuần sau hai bạn sẽ lại đến chứ?\nYến: Có. Nếu thư viện hết chỗ, chúng mình sẽ tìm một nơi yên tĩnh khác. Một chiếc bàn ở nhà cũng có thể phù hợp nếu hai bạn thống nhất giờ và cất điện thoại.", "example": "If all the tables are taken, we will find another quiet place.", "examplevi": "Nếu các bàn đều có người, chúng tôi sẽ tìm nơi yên tĩnh khác."}, {"en": "halfway", "vi": "ở giữa chừng", "kind": "vocab", "context": "Reporter: What happens if you get stuck?\nYến: If I cannot solve something, I’ll write down a question and move on. We take a short break halfway through. At the end, we look at our questions and help each other quietly.", "contextvi": "Phóng viên: Nếu gặp chỗ vướng thì sao?\nYến: Nếu không giải quyết được việc gì, mình sẽ ghi lại câu hỏi rồi làm tiếp. Giữa buổi chúng mình nghỉ một lát. Cuối buổi, hai bạn xem lại các câu hỏi và khẽ trao đổi để giúp nhau.", "example": "We stopped halfway through the lesson.", "examplevi": "Chúng tôi dừng lại giữa buổi học."}, {"en": "stuck", "vi": "gặp chỗ vướng", "kind": "vocab", "context": "Reporter: What happens if you get stuck?\nYến: If I cannot solve something, I’ll write down a question and move on. We take a short break halfway through. At the end, we look at our questions and help each other quietly.", "contextvi": "Phóng viên: Nếu gặp chỗ vướng thì sao?\nYến: Nếu không giải quyết đượ ịnh học ở thư viện vào thứ Năm?", ["Why did you", "and Phúc decide to", "study at the library", "on Thursdays?"]], ["At home I sometimes start three tasks and finish none.", "Ở nhà mình đôi khi bắt đầu ba việc mà chẳng xong việc nào.", ["At home I sometimes", "start three tasks", "and finish none."]], ["We wanted a quiet place where we could work without distractions for one hour.", "Chúng mình muốn một nơi yên tĩnh để học tập mà không bị xao nhãng trong một giờ.", ["We wanted a quiet", "place where we could", "work without distractions", "for one hour."]], ["Last week, I wanted to finish a short report, and Phúc planned to correct five maths problems.", "Tuần trước, mình muốn hoàn thành một báo cáo ngắn, còn Phúc dự định sửa năm bài toán.", ["Last week,", "I wanted to finish", "a short report,", "and Phúc planned to", "correct five maths problems."]], ["If I cannot solve something, I’ll write down a question and move on.", "Nếu không giải quyết được việc gì, mình sẽ ghi lại câu hỏi rồi làm tiếp.", ["If I cannot solve", "something, I’ll", "write down a question", "and move on."]], ["We take a short break halfway through.", "Giữa buổi chúng mình nghỉ một lát.", ["We", "take a short break", "halfway through."]], ["At the end, we look at our questions and help each other quietly.", "Cuối buổi, hai bạn xem lại các câu hỏi và khẽ trao đổi để giúp nhau.", ["At the end,", "we look", "at our questions", "and help each other quietly."]], ["If the library is full, we’ll find another quiet place.", "Nếu thư viện hết chỗ, chúng mình sẽ tìm một nơi yên tĩnh khác.", ["If the library is", "full, we’ll", "find another quiet place."]]], "output": ["Where do you study best?", "What is a realistic goal for one hour?", "What will you do if your study plan fails?", "Write 70–90 words about a one-hour study plan. Include what you will do if you get stuck."], "models": ["I study best at the library because it is quiet. At home I sometimes stop to check messages.", "I could write the first draft of a short report. It is easier to measure than a goal like studying harder.", "If my usual place is noisy, I will find another table. I can also shorten the task and finish it the next day."], "drills": [["A quiet room helps me ________.", "work without distractions"], ["Before you begin, ________ for the study session.", "set one clear goal"], ["If you get stuck, ________ to ask later.", "write down a question"], ["Let’s ________ before we check our work.", "take a short break"], ["If all the tables are taken, we will ________.", "find another quiet place"]]}, {"id": 30, "ch": 6, "title": "A Plan I Can Keep", "genre": "Personal Experience", "p": [{"en": "I used to make a new **timetable** every Sunday. It looked good on paper, but I often forgot to follow it by Wednesday. This month, I decided to **start with one small change** instead of making a long list.", "vi": "Trước đây, Chủ nhật nào tôi cũng lập một thời gian biểu mới. Trên giấy thì có vẻ ổn, nhưng thường đến thứ Tư tôi đã quên làm theo. Tháng này, tôi quyết định bắt đầu bằng một thay đổi nhỏ thay vì lập danh sách dài."}, {"en": "I chose a ten-minute walk after school and put my shoes near the door. “If I see the shoes, I’ll remember the walk,” I wrote in my notebook. To **keep track of my progress**, I put a tick next to the days when I went out.", "vi": "Tôi chọn đi bộ mười phút sau giờ học và để giày cạnh cửa. “Nếu nhìn thấy giày, mình sẽ nhớ đi bộ,” tôi viết vào sổ. Để theo dõi tiến độ, tôi đánh dấu vào những ngày mình đã ra ngoài đi bộ."}, {"en": "On Friday it rained, and I nearly gave up. Instead, I **changed the plan** and walked along the covered **corridor** at home. Next week, I’ll ask a friend to **join me for a walk** on one afternoon when we are both free.", "vi": "Thứ Sáu trời mưa, tôi suýt bỏ cuộc. Sau đó, tôi đổi kế hoạch và đi dọc hành lang có mái che ở nhà. Tuần tới, tôi sẽ rủ một bạn đi bộ cùng vào một buổi chiều cả hai đều rảnh."}, {"en": "I feel more confident because I can **build a habit** without planning every minute. If the walk still fits my routine after a month, I’ll choose a second change. For now, one is enough.", "vi": "Tôi thấy tự tin hơn vì mình có thể hình thành một thói quen mà không phải lên kế hoạch từng phút. Nếu sau một tháng việc đi bộ vẫn phù hợp với nếp sinh hoạt, tôi sẽ chọn thay đổi thứ hai. Hiện tại, một thay đổi là đủ."}], "v": [{"en": "start with one small change", "vi": "bắt đầu bằng một thay đổi nhỏ", "kind": "colloc", "context": "I used to make a new timetable every Sunday. It looked good on paper, but I often forgot to follow it by Wednesday. This month, I decided to start with one small change instead of making a long list.", "contextvi": "Trước đây, Chủ nhật nào tôi cũng lập một thời gian biểu mới. Trên giấy thì có vẻ ổn, nhưng thường đến thứ Tư tôi đã quên làm theo. Tháng này, tôi quyết định bắt đầu bằng một thay đổi nhỏ thay vì lập danh sách dài.", "example": "If you want a new routine, start with one small change.", "examplevi": "Nếu muốn có nếp sinh hoạt mới, hãy bắt đầu bằng một thay đổi nhỏ."}, {"en": "keep track of my progress", "vi": "theo dõi tiến độ của tôi", "kind": "colloc", "context": "I chose a ten-minute walk after school and put my shoes near the door. “If I see the shoes, I’ll remember the walk,” I wrote in my notebook. To keep track of my progress, I put a tick next to the days when I went out.", "contextvi": "Tôi chọn đi bộ mười phút sau giờ học và để giày cạnh cửa. “Nếu nhìn thấy giày, mình sẽ nhớ đi bộ,” tôi viết vào sổ. Để theo dõi tiến độ, tôi đánh dấu vào những ngày mình đã ra ngoài đi bộ.", "example": "I use a notebook to keep track of my progress.", "examplevi": "Tôi dùng sổ để theo dõi tiến độ của mình."}, {"en": "changed the plan", "vi": "đã đổi kế hoạch", "kind": "colloc", "context": "On Friday it rained, and I nearly gave up. Instead, I changed the plan and walked along the covered corridor at home. Next week, I’ll ask a friend to join me for a walk on one afternoon when we are both free.", "contextvi": "Thứ Sáu trời mưa, tôi suýt bỏ cuộc. Sau đó, tôi đổi kế hoạch và đi dọc hành lang có mái che ở nhà. Tuần tới, tôi sẽ rủ một bạn đi bộ cùng vào một buổi chiều cả hai đều rảnh.", "example": "The weather got worse, so I changed the plan.", "examplevi": "Thời tiết xấu đi nên tôi đã đổi kế hoạch."}, {"en": "join me for a walk", "vi": "đi bộ cùng tôi", "kind": "colloc", "context": "On Friday it rained, and I nearly gave up. Instead, I changed the plan and walked along the covered corridor at home. Next week, I’ll ask a friend to join me for a walk on one afternoon when we are both free.", "contextvi": "Thứ Sáu trời mưa, tôi suýt bỏ cuộc. Sau đó, tôi đổi kế hoạch và đi dọc hành lang có mái che ở nhà. Tuần tới, tôi sẽ rủ một bạn đi bộ cùng vào một buổi chiều cả hai đều rảnh.", "example": "Would you like to join me for a walk after school?", "examplevi": "Bạn có muốn đi bộ cùng tôi sau giờ học không?"}, {"en": "build a habit", "vi": "hình thành một thói quen", "kind": "colloc", "context": "I feel more confident because I can build a habit without planning every minute. If the walk still fits my routine after a month, I’ll choose a second change. For now, one is enough.", "contextvi": "Tôi thấy tự tin hơn vì mình có thể hình thành một thói quen mà không phải lên kế hoạch từng phút. Nếu sau một tháng việc đi bộ vẫn phù hợp với nếp sinh hoạt, tôi sẽ chọn thay đổi thứ hai. Hiện tại, một thay đổi là đủ.", "example": "Repeating a small action can help you build a habit.", "examplevi": "Lặp lại một việc nhỏ có thể giúp bạn hình thành một thói quen."}, {"en": "timetable", "vi": "thời gian biểu", "kind": "vocab", "context": "I used to make a new timetable every Sunday. It looked good on paper, but I often forgot to follow it by Wednesday. This month, I decided to start with one small change instead of making a long list.", "contextvi": "Trước đây, Chủ nhật nào tôi cũng lập một thời gian biểu mới. Trên giấy thì có vẻ ổn, nhưng thường đến thứ Tư tôi đã quên l function updateReadAlong() {
  const button = $('readAlong');
  const player = $('player');
  if (!button || !player) return;
  const times = audioURLs[r().id] ? null : PARAGRAPH_TIMES[r().id];
  let active = -1;
  if (times && button.getAttribute('aria-pressed') === 'true' && player.currentTime > 0 && !player.ended) {
    active = times.findLastIndex(time => player.currentTime >= time);
  }
  $('readingBody').querySelectorAll('[data-paragraph]').forEach(p => {
    p.classList.toggle('following', Number(p.dataset.paragraph) === active);
  });
}

function setupAudio() {
  const player = $('player');
  const id = r().id;
  const play = $('playAudio');
  const stop = $('stopAudio');
  const seek = $('audioSeek');
  const speed = $('audioSpeed');
  const status = $('audioStatus');
  const follow = $('readAlong');
  activeAudio = player;

  const formatTime = seconds => {
    const whole = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  };
  function update() {
    if (!player.isConnected) return;
    $('audioTime').textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
    seek.value = player.currentTime;
    play.textContent = player.paused ? '▶ Play' : '❚❚ Pause';
    updateReadAlong();
  }

  player.onloadedmetadata = () => {
    play.disabled = stop.disabled = seek.disabled = false;
    follow.disabled = !PARAGRAPH_TIMES[id] || !!audioURLs[id];
    follow.title = follow.disabled ? 'Read-along is unavailable for this recording' : 'Highlight the current paragraph';
    seek.max = player.duration;
    status.hidden = true;
    update();
  };
  player.onerror = () => {
    play.disabled = stop.disabled = seek.disabled = follow.disabled = true;
    status.textContent = 'Audio could not load. Choose another audio file.';
    status.hidden = false;
    update();
  };
  player.onplay = () => { stopSpeech(); update(); };
  player.onpause = player.onended = player.ontimeupdate = update;
  play.onclick = () => {
    if (player.paused) player.play().catch(() => toast('Audio could not play.'));
    else player.pause();
  };
  stop.onclick = () => { player.pause(); player.currentTime = 0; update(); };
  seek.oninput = () => { player.currentTime = Number(seek.value); update(); };
  speed.onchange = () => { player.playbackRate = Number(speed.value); };

  play.disabled = stop.disabled = seek.disabled = follow.disabled = true;
  follow.setAttribute('aria-pressed', 'false');
  follow.textContent = '▶ Read-along · OFF';
  status.hidden = false;
  status.textContent = 'Loading audio…';
  player.src = audioURLs[id] || './reading' + num(id) + '.mp3';
  player.playbackRate = Number(speed.value);
}

const manualHighlights = new Map();
const highlightColors = new Set(['yellow', 'pink']);
let pendingHighlightSelection = null;

function selectedPassageRanges() {
  const selection = window.getSelection();
  const passage = $('readingBody');
  if (!passage || !selection || !selection.rangeCount || selection.isCollapsed) return [];
  const range = selection.getRangeAt(0);
  if (!passage.contains(range.startContainer) || !passage.contains(range.endContainer)) return [];

  return Array.from(passage.querySelectorAll('[data-paragraph]')).flatMap(paragraph => {
    if (!range.intersectsNode(paragraph)) return [];
    const length = paragraph.textContent.length;
    const offset = (container, index) => {
      const prefix = document.createRange();
      prefix.selectNodeContents(paragraph);
      prefix.setEnd(container, index);
      return prefix.toString().length;
    };
    const start = paragraph.contains(range.startContainer) ? offset(range.startContainer, range.startOffset) : 0;
    const end = paragraph.contains(range.endContainer) ? offset(range.endContainer, range.endOffset) : length;
    return end > start && paragraph.textContent.slice(start, end).trim()
      ? [{ paragraph: Number(paragraph.dataset.paragraph), start, end }] : [];
  });
}

function replaceHighlightRange(marks, selection, color) {
  const { paragraph, start, end } = selection;
  const next = marks.flatMap(mark => {
    if (mark.paragraph !== paragraph || mark.end <= start || mark.start >= end) return [mark];
    const remaining = [];
    if (mark.start < start) remaining.push({ ...mark, end: start });
    if (mark.end > end) remaining.push({ ...mark, start: end });
    return remaining;
  });
  if (highlightColors.has(color)) next.push({ ...selection, color });
  return next.sort((a, b) => a.paragraph - b.paragraph || a.start - b.start);
}

function restoreManualHighlights() {
  const marks = manualHighlights.get(r().id);
  if (!marks?.length) return;
  const passage = $('readingBody');
  for (const paragraph of passage.querySelectorAll('[data-paragraph]')) {
    const ranges = marks.filter(mark => mark.paragraph === Number(paragraph.dataset.paragraph));
    if (!ranges.length) continue;
    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    let offset = 0;
    for (const node of nodes) {
      const text = node.data;
      const end = offset + text.length;
      const overlaps = ranges.filter(mark => mark.start < end && mark.end > offset);
      if (overlaps.length) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const mark of overlaps) {
          const from = Math.max(0, mark.start - offset);
          const to = Math.min(text.length, mark.end - offset);
          fragment.append(text.slice(cursor, from));
          const span = document.createElement('mark');
          span.className = 'manual-highlight ' + mark.color;
          span.textContent = text.slice(from, to);
          fragment.append(span);
          cursor = to;
        }
        fragment.append(text.slice(cursor));
        node.replaceWith(fragment);
      }
      offset = end;
    }
  }
}

function refreshPassage() {
  $('readingBody').innerHTML = readBody();
  restoreManualHighlights();
  updateReadAlong();
}

function useHighlightPen(color) {
  let ranges = selectedPassageRanges();
  if (!ranges.length && pendingHighlightSelection?.reading === r().id) {
    ranges = pendingHighlightSelection.ranges;
  }
  pendingHighlightSelection = null;
  if (!ranges.length) {
    toast('Select some English text first.');
    return;
  }
  const existing = manualHighlights.get(r().id) || [];
  manualHighlights.set(r().id, ranges.reduce((marks, range) => replaceHighlightRange(marks, range, color), existing));
  window.getSelection()?.removeAllRanges();
  closePop();
  refreshPassage();
}

document.addEventListener('pointerdown', event => {
  const button = event.target.closest('[data-pen]');
  if (!button) {
    pendingHighlightSelection = null;
    return;
  }
  pendingHighlightSelection = { reading: r().id, ranges: selectedPassageRanges() };
  if (event.pointerType === 'mouse' && pendingHighlightSelection.ranges.length) event.preventDefault();
});

function emphasize(txt,term){let t=esc(txt),q=esc(term),i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?t:t.slice(0,i)+'<strong>'+t.slice(i,i+q.length)+'</strong>'+t.slice(i+q.length)}
function openPop(i,el){let v=r().v[i];if(!v)return;stopSpeech();popState=i;let p=$('pop');p.innerHTML=`<div class="rowline"><button class="btn" data-speak="${esc(v.en)}" aria-label="Listen to term">♫</button><button class="popclose" data-close="1" aria-label="Close">×</button></div><h2>${esc(v.en)}</h2><p class="popmeaning">${esc(v.vi)}</p><p class="popcontext">${emphasize(v.example,v.en)}</p><p class="popvi">${esc(v.examplevi)}</p><button class="tiny" data-speak="${esc(v.example)}">♪ Listen to example</button><div class="popfoot"><button data-status="known">I know this</button><button data-status="study">Study</button></div>`;p.classList.remove('hidden');let rect=el.getBoundingClientRect(),ww=p.offsetWidth,hh=p.offsetHeight;let x=rect.left+Math.min(rect.width,150)/2-ww/2,y=rect.bottom+8;x=Math.max(12,Math.min(innerWidth-ww-12,x));if(y+hh>innerHeight-10)y=Math.max(10,rect.top-hh-8);p.style.left=x+'px';p.style.top=y+'px'}function closePop(){stopSpeech();$('pop').classList.add('hidden');popState=null}
function handleClick(e){let b=e.target.closest('button,[role=button]');if(!b){if(!$('pop').contains(e.target))closePop();return}if(b.disabled)return;let d=b.dataset;if(d.pen){useHighlightPen(d.pen);return}if(d.collocVi!==undefined){collocVietnamese=!collocVietnamese;refreshQuiz('colloc');$('quiz-colloc').querySelector('[data-colloc-vi]').focus();return}if(d.term!==undefined){if(!b.matches('.term')||!selectedPassageRanges().length)openPop(+d.term,b);return}if(d.close){closePop();return}if(d.status&&popState!==null){statuses[vk(r().id,popState)]=d.status;save('abhi46_cards_v1',statuses);closePop();if($('readingBody'))refreshPassage();toast(d.status==='known'?'Marked as known':'Added to study');return}if(d.speak!==undefined){speech(d.speak);return}if(d.go!==undefined){go(+d.go);return}if(d.tab){setTab(d.tab);return}if(d.toggle==='follow'){
  const enabled = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', enabled);
  b.textContent = '▶ Read-along · ' + (enabled ? 'ON' : 'OFF');
  updateReadAlong();
  return;
}if(d.toggle){if(d.toggle==='vi')vi=!vi;else high=!high;b.setAttribute('aria-pressed',d.toggle==='vi'?vi:high);b.textContent=d.toggle==='vi'?'VI · '+(vi?'ON':'OFF'):'✓ Highlights · '+(high?'ON':'OFF');refreshPassage();return}if(d.audio){$('audioFile').click();return}if(d.answer){let [s,i]=d.answer.split(':');answers[key(s,i)]=d.value;delete checked[sk(s)];save('abhi46_answers_v2',answers);save('abhi46_checked_v2',checked);refreshQuiz(s);return}if(d.check){let s=d.check;checked[sk(s)]=true;save('abhi46_checked_v2',checked);feedback(qs(s).every((q,i)=>norm(answers[key(s,i)])===norm(q[1])));refreshQuiz(s);return}if(d.reset){let s=d.reset;qs(s).forEach((q,i)=>delete answers[key(s,i)]);delete checked[sk(s)];save('abhi46_answers_v2',answers);save('abhi46_checked_v2',checked);refreshQuiz(s);return}if(d.submit){['colloc','grammar','word'].forEach(s=>checked[sk(s)]=true);save('abhi46_checked_v2',checked);render();toast(drillScore());return}if(d.resetall){['colloc','grammar','word'].forEach(s=>{qs(s).forEach((q,i)=>delete answers[key(s,i)]);delete checked[sk(s)]});save('abhi46_answers_v2',answers);save('abhi46_checked_v2',checked);render();return}if(d.chunk!==undefined){let i=+d.chunk;if(!chunkSel.includes(i))chunkSel.push(i);chunkChecked=false;render();return}if(d.remove!==undefined){chunkSel.splice(+d.remove,1);chunkChecked=false;render();return}if(d.chaction){let act=d.chaction;if(act==='check'){chunkChecked=true;feedback(norm(chunkSel.map(i=>chunksFor(r().chunks[chunkIndex][0])[i]).join(' '))===norm(r().chunks[chunkIndex][0]))}else if(act==='hint')chunkHint=!chunkHint;else if(act==='show')chunkShow=!chunkShow;else if(act==='clear'){chunkSel=[];chunkChecked=chunkShow=false}else if(act==='prev'||act==='next'){chunkIndex+=act==='next'?1:-1;chunkSel=[];chunkChecked=chunkShow=chunkHint=false}render();return}if(d.rev){let list=reviewItems(),v=list[reviewIndex];if(d.rev==='reveal')reviewReveal=!reviewReveal;else if(d.rev==='next'||d.rev==='prev'){reviewIndex+=d.rev==='next'?1:-1;reviewReveal=false}else if(v){statuses[vk(v.rid,v.i)]=d.rev;save('abhi46_cards_v1',statuses);if(reviewFilter==='all')reviewIndex=Math.min(list.length-1,reviewIndex+1);reviewReveal=false}render();return}if(d.writesave){save('abhi46_writing_v1',writing);toast('Draft saved locally');return}if(d.writeclear){delete writing[r().id+':w'];save('abhi46_writing_v1',writing);render();return}if(!$('pop').contains(b))closePop()}
document.addEventListener('click',handleClick);document.addEventListener('input',e=>{let el=e.target;if(el.dataset.input){let [s,i]=el.dataset.input.split(':');answers[key(s,i)]=el.value;delete checked[sk(s)];save('abhi46_answers_v2',answers);save('abhi46_checked_v2',checked);el.classList.remove('good','bad');let quiz=$('quiz-'+s);if(quiz){quiz.querySelectorAll('.result').forEach(n=>n.remove());quiz.querySelectorAll('.good,.bad').forEach(n=>n.classList.remove('good','bad'));quiz.querySelectorAll('.actions .progress').forEach(n=>n.remove());if($('drillTotal'))$('drillTotal').textContent=drillScore();quiz.querySelector('.progress').textContent=qs(s).filter((q,j)=>String(answers[key(s,j)]||'').trim()).length+'/'+qs(s).length+' answered'}}if(el.dataset.writing){writing[el.dataset.writing]=el.value;save('abhi46_writing_v1',writing);if(el.id==='writebox')$('wordCount').textContent=el.value.trim().split(/\s+/).filter(Boolean).length+' words · saved locally'}});document.addEventListener('change',e=>{if(e.target.id==='mobileSelect')go(+e.target.value);if(e.target.id==='reviewScope'){reviewScope=e.target.value;reviewIndex=0;reviewReveal=false;render()}if(e.target.id==='reviewFilter'){reviewFilter=e.target.value;reviewIndex=0;reviewReveal=false;render()}});$('audioFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let id=r().id;if(audioURLs[id])URL.revokeObjectURL(audioURLs[id]);audioURLs[id]=URL.createObjectURL(file);e.target.value='';setupAudio()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.term')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.dataset.input){e.preventDefault();let s=e.target.dataset.input.split(':')[0];checked[sk(s)]=true;save('abhi46_checked_v2',checked);refreshQuiz(s)}});window.addEventListener('resize',closePop);render();
</script></body></html>
