:root {
  --paper: #fcf8ef;
  --bg: #f4ecdf;
  --line: #ebd9bf;
  --teal: #009b8f;
}
.shell {
  grid-template-columns: clamp(192px, 12.5vw, 250px) minmax(0, 1fr);
  gap: clamp(14px, 1vw, 22px);
  max-width: 2080px;
  padding: clamp(12px, 1.1vw, 22px);
}
.sidebar {gap: 8px}
.ch {padding: 8px; border-radius: 13px}
.chhead {margin: 2px 3px 7px; gap: 8px}
.chhead img {width: 38px; height: 34px; flex: none}
.chhead b {font-size: 14px}
.chhead small {font-size: 10px; margin-top: 2px}
.lesson {margin: 0; gap: 7px; min-height: 36px; padding: 5px 6px; font-size: clamp(12px, .68vw, 14px); line-height: 1.25}
.lesson + .lesson {margin-top: 4px}
.lesson > span:nth-child(2) {min-width: 0; overflow-wrap: anywhere}
.lesson .num {width: 23px; height: 23px; font-size: 11px}
.lesson.active {background: #e2ffa9; border-color: #d6ec9a}
.lesson.active .num {background: #b1e16b}
.home-paper {padding: clamp(16px, 1.25vw, 26px); min-height: 0; border-radius: 16px}
.home-paper h1 {font-size: clamp(28px, 2.45vw, 48px); margin: 8px 0 0}
.home-paper .audioBar {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
  gap: 10px;
  background: #f5ead7;
  padding: 12px 15px;
  margin-top: 18px;
}
.home-paper .audioBar audio {display: none}
.audioBar .play {min-width: 100px; padding: 10px 15px; min-height: 40px}
.audioBar .stop {width: 38px; height: 38px; border-radius: 50%; background: #fffaf3}
.audioBar .seek {width: 100%; min-width: 0; accent-color: var(--teal); margin: 0; cursor: pointer}
.audioBar .time {font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap}
.audioBar .speed {padding: 6px; border: 0; background: transparent}
.audioBar .audioNote {grid-column: 1 / -1; min-width: 0; font-size: 12px}
.home-paper .toolbar {gap: 8px; margin: 19px 0 15px}
.home-paper .tiny {font-size: 12px; border-color: #dcd2c4; white-space: nowrap}
.home-paper .toolbar button[aria-pressed=true] {background: #e9f1dd; border-color: #c8d8b6}
.home-paper .toolbar button[data-toggle=high][aria-pressed=true] {background: transparent; border-color: #dcd2c4}
.home-paper .readinggrid {
  display: grid;
  align-items: start;
}
.home-paper .readingtext .following {background: #e8f2dc; border-radius: 4px; box-shadow: -5px 0 #e8f2dc, 5px 0 #e8f2dc}
.home-paper .imagecol {order: 0; margin: 0; width: 100%}
.home-paper .photo {aspect-ratio: 1.3; max-height: none; border: 1px solid var(--line); border-radius: 15px}
.home-collocations {margin-top: clamp(16px, 1.4vw, 26px); padding: 15px 18px; border-radius: 14px; background: #ffdcd6}
.home-collocations h2 {color: #aa2918; font-size: clamp(18px, 1.28vw, 24px); margin-bottom: 10px}
.home-chips {display: flex; flex-wrap: wrap; gap: 7px}
.home-chip {
  padding: 6px 12px;
  border: 0;
  border-radius: 20px;
  background: #fff9f5;
  font-size: clamp(12px, .83vw, 16px);
  text-align: left;
}
.home-chip:hover {background: #fff}
.home-pagination {display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 17px 4px 0}
.home-pagination .btn {justify-self: start; color: #62594f}
.home-pagination .btn:last-child {justify-self: end}
.home-pagination .note {font-size: 12px}
@media (max-width: 1050px) {
  .shell {grid-template-columns: 185px minmax(0, 1fr)}
}
@media (max-width: 850px) {
  .home-paper .readinggrid {gap: 14px}
  .home-paper .imagecol {order: -1}
  .home-paper .photo {aspect-ratio: 16/9; max-height: 370px}
  .home-paper .toolbar {margin-top: 14px}
}
@media (max-width: 620px) {
  .home-paper .audioBar {grid-template-columns: auto auto minmax(0,1fr) auto; gap: 8px; padding: 9px}
  .audioBar .play {min-width: 76px}
  .audioBar .seek {grid-column: 1 / 4; grid-row: 2}
  .audioBar .time {grid-row: 2; grid-column: 4; justify-self: end}
  .audioBar .speed {grid-column: 3; justify-self: end}
  .audioBar .audio-load {grid-column: 4}
  .home-pagination .btn {font-size: 12px; padding-inline: 8px}
}

/* Compact Home typography and a shared row for the passage and illustration. */
.home-paper .readinggrid {
  grid-template-columns: minmax(0, 1.16fr) minmax(0, 1fr);
  gap: clamp(16px, 1.4vw, 28px);
}
.home-paper .readingtext {
  font-size: clamp(16px, 1rem + .34vw, 22px);
  line-height: 1.56;
  text-align: start;
}
.home-paper .readingtext p {margin: 0 0 .62em}
.home-paper .readingtext > :last-child {margin-bottom: 0}
@media (min-width: 851px) {
  .home-paper .readinggrid:not(.with-translation) .imagecol {
    position: relative;
    align-self: stretch;
    min-height: clamp(210px, 17vw, 340px);
    container-type: inline-size;
  }
  .home-paper .readinggrid:not(.with-translation) .photo {
    position: absolute;
    inset: 0;
    height: 100%;
    max-height: 95cqw;
    aspect-ratio: auto;
  }
}
@media (max-width: 850px) {
  .home-paper .readinggrid {grid-template-columns: minmax(0, 1fr); gap: 14px}
  .home-paper .readingtext {font-size: 17px; line-height: 1.55}
}
#quiz-colloc .question {margin-bottom: 3px}
#quiz-colloc .colloc-hint {margin: 0 0 9px; color: #784635; font-size: 14px; line-height: 1.5}
.pen-tools {display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap}
.home-paper .pen-tools [data-pen] {display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 4px 7px; font-size: 11px}
.pen-swatch {width: 11px; height: 11px; border-radius: 3px; border: 1px solid #0002}
.pen-swatch.yellow, .manual-highlight.yellow {background: #ffe374}
.pen-swatch.pink, .manual-highlight.pink {background: #ffaed0}
.manual-highlight {color: inherit; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone}
@media (max-width: 620px) {.pen-tools {margin-left: 0}}

const DATA=[{"id": 16, "ch": 4, "title": "A Visit to a Stilt House", "genre": "Personal Experience", "p": [{"en": "On our class trip, I climbed the wooden steps of a **stilt house**. My friend Vy asked, “Does anyone live here?” Our **host**, Ms Lan, smiled. “Yes. This is my family home. Please leave your shoes by the door.”", "vi": "Trong chuyến đi của lớp, tôi bước lên cầu thang gỗ của một ngôi nhà sàn. Bạn Vy hỏi: “Có ai sống ở đây không ạ?” Cô Lan, chủ nhà, mỉm cười: “Có chứ. Đây là nhà của gia đình cô. Các cháu để giày cạnh cửa nhé.”"}, {"en": "Inside, Ms Lan showed us the **main room**, where her family eats and welcomes guests. She explained that the open space **under the floor** can be useful for storing tools. Vy looked down through a **narrow** gap between two boards.", "vi": "Bên trong, cô Lan dẫn chúng tôi xem gian chính, nơi gia đình cô ăn uống và đón khách. Cô giải thích rằng khoảng trống dưới sàn có thể dùng để cất dụng cụ. Vy nhìn xuống qua một khe hẹp giữa hai tấm ván."}, {"en": "“What is this basket made of?” I asked. “Bamboo,” Ms Lan replied. There was some rice in the basket, and there were two small bowls next to it. Before lunch, she taught us to **weave bamboo strips** into a simple square.", "vi": "“Chiếc giỏ này làm bằng gì ạ?” tôi hỏi. “Bằng tre,” cô Lan đáp. Giỏ có một ít gạo, bên cạnh là hai chiếc bát nhỏ. Trước bữa trưa, cô chỉ chúng tôi đan nan tre thành một hình vuông đơn giản."}, {"en": "Back at school, I drew the house for our class display. I left room for a short note about our host. Her stories helped me understand how a building can reflect the way people **go about daily life**.", "vi": "Khi trở lại trường, tôi vẽ ngôi nhà để trưng bày trong lớp. Tôi chừa chỗ viết vài dòng về cô chủ nhà. Những câu chuyện của cô giúp tôi hiểu một công trình có thể phản ánh cách mọi người sinh hoạt hằng ngày như thế nào."}], "v": [{"en": "stilt house", "vi": "nhà sàn", "kind": "colloc", "context": "On our class trip, I climbed the wooden steps of the floor can be useful for storing tools.", "Cô giải thích rằng khoảng trống dưới sàn có thể dùng để cất dụng cụ.", ["She explained that the", "open space", "under the floor", "can be useful", "for storing tools."]], ["Vy looked down through a narrow gap between two boards.", "Vy nhìn xuống qua một khe hẹp giữa hai tấm ván.", ["Vy looked down through", "a narrow gap between", "two boards."]], ["There was some rice in the basket, and there were two small bowls next to it.", "Giỏ có một ít gạo, bên cạnh là hai chiếc bát nhỏ.", ["There was some rice", "in the basket,", "and there were two", "small bowls next to it."]], ["Before lunch, she taught us to weave bamboo strips into a simple square.", "Trước bữa trưa, cô chỉ chúng tôi đan nan tre thành một hình vuông đơn giản.", ["Before lunch,", "she taught us to", "weave bamboo strips", "into a simple square."]], ["Back at school, I drew the house for our class display.", "Khi trở lại trường, tôi vẽ ngôi nhà để trưng bày trong lớp.", ["Back at school,", "I drew the house", "for our class display."]], ["I left room for a short note about our host.", "Tôi chừa chỗ viết vài dòng về cô chủ nhà.", ["I left room", "for a short note", "about our host."]]], "output": ["What would you ask a host in a stilt house?", "What material would you use for a model house?", "How can a house tell us about its owners?", "Write 70–90 words about a home you have visited. Describe two features and ask one question about it."], "models": ["I would ask what the space under the floor is used for. I would also ask which room the family uses when guests arrive.", "I would use thin pieces of bamboo and paper. The bamboo would make strong posts, and the paper would be easy to cut.", "Its rooms show what people do together. A large main room may give a family a place to have meals and welcome guests."], "drills": [["The family invited us into their ________.", "stilt house"], ["We sat on a mat in the ________.", "main room"], ["They found an old key ________.", "under the floor"], ["We learned to ________ in the workshop.", "weave bamboo strips"], ["The documentary shows how the residents ________.", "go about daily life"]]}, {"id": 17, "ch": 4, "title": "A Pattern with a Story", "genre": "Profile", "p": [{"en": "Mai visited a weaving workshop to find out how people **make woven cloth**. A local **artisan** named Hoa was working at a wooden loom. There were a few rolls of **thread** on the floor, but she was using only two colours that morning.", "vi": "Mai đến một xưởng dệt để tìm hiểu cách người ta dệt vải. Một nghệ nhân địa phương tên Hoa đang làm việc bên khung cửi gỗ. Dưới sàn có vài cuộn chỉ, nhưng sáng hôm đó cô chỉ dùng hai màu."}, {"en": "“How many colours do you usually use?” Mai asked. “It depends on the design,” Hoa replied. She showed Mai how to **repeat a pattern** by following the same steps. A tiny mistake could change the shape, so Mai worked slowly.", "vi": "“Cô thường dùng bao nhiêu màu ạ?” Mai hỏi. “Còn tùy vào mẫu cháu ạ,” cô Hoa đáp. Cô chỉ Mai cách lặp lại một họa tiết bằng việc làm theo các bước giống nhau. Một lỗi nhỏ cũng có thể làm hình dạng thay đổi, nên Mai làm thật chậm."}, {"en": "Hoa explained that her mother had taught her the first design. Now she runs a weekend class to **pass on her skills**. Some learners want to make bags, while others hope to **keep a family tradition alive**. Both groups learn the same basic steps.", "vi": "Cô Hoa kể rằng mẹ là người dạy cô mẫu đầu tiên. Bây giờ cô mở lớp cuối tuần để truyền lại kỹ năng. Một số học viên muốn làm túi, còn những người khác mong duy trì truyền thống gia đình. Cả hai nhóm đều học những bước cơ bản giống nhau."}, {"en": "By the end, Mai had made only a short strip. However, she could **explain the process** to a friend. She understood that the pattern mattered partly because it connected people who had learned from one another.", "vi": "Cuối buổi, Mai mới làm được một dải vải ngắn. Tuy vậy, em đã có thể giải thích quy trình cho một người bạn. Em hiểu rằng họa tiết ấy có ý nghĩa một phần vì nó kết nối những người từng học hỏi lẫn nhau."}], "v": [{"en": "make woven cloth", "vi": "dệt vải", "kind": "colloc", "context": "Mai visited a weaving workshop to find out how people make woven cloth. A local artisan named Hoa was working at a wooden loom. There were a few rolls of thread on the floor, but she was using only two colours that morning.", "contextvi": "Mai đến một xưởng dệt để tìm hiểu cách người ta dệt vải. Một nghệ nhân địa phương tên Hoa đang làm việc bên khung cửi gỗ. Dưới sàn có vài cuộn chỉ, nhưng sáng hôm đó cô chỉ dùng hai màu.", "example": "The artisans use these looms to make woven cloth.", "examplevi": "Các nghệ nhân dùng những khung cửi này để dệt vải."}, {"en": "repeat a pattern", "vi": "lặp lại một họa tiết", "kind": "colloc", "context": "“How many colours do you usually use?” Mai asked. “It depends on the design,” Hoa replied. She showed Mai how to repeat a pattern by following the same steps. A tiny mistake could change the shape, so Mai worked slowly.", "contextvi": "“Cô thường dùng bao nhiêu màu ạ?” Mai hỏi. “Còn tùy vào mẫu cháu ạ,” cô Hoa đáp. Cô chỉ Mai cách lặp lại một họa tiết bằng việc làm theo các bước giống nhau. Một lỗi nhỏ cũng có thể làm hình dạng thay đổi, nên Mai làm thật chậm.", "example": "Follow the same steps if you want to repeat a pattern.", "examplevi": "Hãy làm theo các bước giống nhau nếu bạn muốn lặp lại một họa tiết."}, {"en": "pass on her skills", "vi": "truyền lại kỹ năng của mình", "kind": "colloc", "context": "Hoa explained that her mother had taught her the first design. Now she runs a weekend class to pass on her skills. Some learners want to make bags, while others hope to keep a family tradition alive. Both groups learn the same basic steps.", "contextvi": "Cô Hoa kể rằng mẹ là người dạy cô mẫu đầu tiên. Bây giờ cô mở lớp cuối tuần để truyền lại kỹ năng. Một số học viên muốn làm túi, còn những người khác mong duy trì truyền thống gia đình. Cả hai nhóm đều học những bước cơ bản giống nhau.", "example": "She opened a weekend class to pass on her skills.", "examplevi": "Cô mở lớp cuối tuần để truyền lại kỹ năng của mình."}, {"en": "keep a family tradition alive", "vi": "duy trì truyền thống gia đình", "kind": "colloc", "context": "Hoa explained that her mother had taught her the first design. Now she runs a weekend class to pass on her skills. Some learners want to make bags, while others hope to keep a family tradition alive. Both groups learn the same basic steps.", "contextvi": "Cô Hoa kể rằng mẹ là người dạy cô mẫu đầu tiên. Bây giờ cô mở lớp cuối tuần để truyền lại kỹ năng. Một số học viên muốn làm túi, còn những người khác mong duy trì truyền thống gia đình. Cả hai nhóm đều học những bước cơ bản giống nhau.", "example": "Their children sew together to keep a family tradition alive.", "examplevi": "Các con của họ cùng may vá để duy trì truyền thống gia đình."}, {"en": "explain the process", "vi": "giải thích quy trình", "kind": "colloc", "context": "By the end, Mai had made only a short strip. However, she could explain the process to a friend. She understood that the pattern mattered partly because it connected people who had learned from one another.", "contextvi": "Cuối buổi, Mai mới làm được một dải vải ngắn. Tuy vậy, em đã có thể giải thích quy trình cho một người bạn. Em hiểu rằng họa tiết ấy có ý nghĩa một phần vì nó kết nối những người từng học hỏi lẫn nhau.", "example": "Could you explain the process to the new group?", "examplevi": "Bạn có thể giải thích quy trình cho nhóm mới không?"}, {"en": "artisan", "vi": "nghệ nhân", "kind": "vocab", "context": "Mai visited a weaving workshop to find out how people make woven cloth. A local artisan named Hoa was working at a wooden loom. There were a few rolls of thread on the floor, but she was using only two colours that morning.", "contextvi": "Mai đến một xưởng dệt để tìm hiểu cách người ta dệt vải. Một nghệ nhân địa phương tên Hoa đang làm việc bên khung cửi gỗ. Dưới sàn có vài cuộn chỉ, nhưng sáng hôm đó cô chỉ dùng hai màu.", "example": "An artisan made this basket by hand.", "examplevi": "Một nghệ nhân đã làm chiếc giỏ này bằng tay."}, {"en": "thread", "vi": "chỉ", "kind": "vocab", "context": "Mai visited a weaving workshop to find out how people make woven cloth. A local artisan named Hoa was working at a wooden loom. There were a few rolls of thread on the floor, but she was using only two colours that morning.", "contextvi": "Mai đến một xưởng dệt để tìm hiểu cách người ta dệt vải. Một nghệ nhân địa phương tên Hoa đang làm việc bên khung cửi gỗ. Dưới sàn có vài cuộn chỉ, nhưng sáng hôm đó cô chỉ dùng hai màu.", "example": "Hoa chose a roll of blue thread.", "examplevi": "Cô Hoa chọn một cuộn chỉ xanh."}], "image": "data:image/webp;base64,UklGRn6QAABXRUJQVlA4IHKQAAAQUwGdASo+AT4BPkUaikQioaEW+saQKAREsQBU0wgqf7H94/0vNP5R7fPlv4T1fP33Qn155RfTn/n/zntd/3H7Ue7j+1f7D2DP7X/l/Pr9ZP+L/8nqP/p3+o/cr3av+R+5fu2/rv/C/bj/VfIT/Yv9J/9fal/93/////ww/3j/s//n/1/BV+5n/29pT/4fvT8PH9+/7v7of//4hf+P///YA///tw6TvwK/Mfjp5j+Kr2b+2/5P/f/37/4/QP9y4O/XP57/n/6f1D/mX4K/Vf379zP8D+6n3I/j/+r/qfGP5Kf6H+S/dv4CPy7+l/6H+8fuL/if3S+z36v9tu8z4r/Wf+b/TewR7c/V/9t/hP9N/4P8J6d3+t/nfVD9Y/vf/T/yv+e/Zj7Af5n/Tv9z/f/3t/0v//+iP+D/7PJP+t/7X9pfgG/nP92/6v+U/1P7jfK1/4f6f/c/uh7v/qj/zf6T/Z/If/PP7x/z/8V/n/2h/////+/H2sekz+8Ld+pIDycwAcdhVYC36kQ1Igv7vsbMTlnbi/rCFzrOlk41jPjkpKH8H5KwvL1DOmzDv5kwVlP/T+ZrQ/LVpGxnLKJlUu0FPjqKqGzmA2Av+gYzrH3KjojYh5oAflwDNZ3M/fAGMta9M3FzVssta0nj/rp5Orityt11z4G9S5jlhgjcdcmJiF2tq7MMDd9XWCaE0/D4JXTZ7N4CTCDAtXpPxwm6ivg8Pnd1q9vklgQZ70nIdrOVzmqwf0607wE5tIYk8SxXh3n5FW0VDr5x8haEkrWUXqrVajp3XvQxlJPzGQD3UzDR6D0/iP/lWN8hM+CysgFfzcxVWjrGPRklwzdKl5ioqVTBORiiuWxvYP+jpjo5/4e+g7fY4kug4AOCwtcG58swSvQmmf6UoSo5kLUtEJuoL0fXEPimAc6U86OpnzDQdFe7CG6xW8gKOPCENZfGay+xFKWfm3xJ6HfgBtJR8FU5/ESMBcbq/Z/P3wAFv9qGUgwRnMSf4wJ6TmTyNnarWlStlF3WCwwg6/AhJoVE8nxHbreFaYeVSiOoW3LYmaXV0rq/pO4EBdcsLrHq5yO0m2aerZx12GXMph/4wuPjzX/NWL+44xq1kb6d2xBWPoFxRrLwqiPcww41wMEwmVUEaF1AYydsP5pP0cp ught her the first design.", "Cô Hoa kể rằng mẹ là người dạy cô mẫu đầu tiên.", ["Hoa explained that her", "mother had taught her", "the first design."]], ["Now she runs a weekend class to pass on her skills.", "Bây giờ cô mở lớp cuối tuần để truyền lại kỹ năng.", ["Now she runs a", "weekend class to", "pass on her skills."]], ["Some learners want to make bags, while others hope to keep a family tradition alive.", "Một số học viên muốn làm túi, còn những người khác mong duy trì truyền thống gia đình.", ["Some learners want to", "make bags,", "while others hope to", "keep a family tradition alive."]]], "output": ["Which craft would you like to learn?", "How can a child keep a tradition alive?", "What makes a good first lesson?", "Write 70–90 words about a craft. Explain how a beginner can learn it and why it matters to someone."], "models": ["I would like to learn weaving because I enjoy working with colours. I would start with a simple pattern.", "A child can learn from a relative and practise regularly. Later, they can teach the same skill to a friend.", "A good first lesson uses a short task with clear steps. Learners should finish something small and be able to explain how they did it."], "drills": [["The artisans use these looms to ________.", "make woven cloth"], ["Follow the same steps if you want to ________.", "repeat a pattern"], ["She opened a weekend class to ________.", "pass on her skills"], ["Their children sew together to ________.", "keep a family tradition alive"], ["Could you ________ to the new group?", "explain the process"]]}, {"id": 18, "ch": 4, "title": "Listening to a Gong", "genre": "Classroom Report", "p": [{"en": "During an exchange visit in the Central Highlands, we saw a large **bronze gong** in a community hall. There were several instruments in the room, but our host chose one to show us first. “What happens if I hit it hard?” a classmate asked.", "vi": "Trong chuyến giao lưu ở Tây Nguyên, chúng tôi thấy một chiếc cồng bằng đồng lớn trong nhà sinh hoạt cộng đồng. Trong phòng có vài nhạc cụ, nhưng chủ nhà chọn một chiếc để giới thiệu trước. Một bạn hỏi: “Nếu cháu đánh mạnh thì sẽ thế nào ạ?”"}, {"en": "Our host **struck the gong** **gently**. We listened until the sound faded. Then he played it a little harder so we could compare the sounds. He let us try only after showing us where to stand and how to hold the stick.", "vi": "Chủ nhà đánh nhẹ vào chiếc cồng. Chúng tôi lắng nghe cho đến khi âm thanh tắt dần. Sau đó, chú đánh mạnh hơn một chút để chúng tôi so sánh. Chú chỉ cho chúng tôi thử sau khi hướng dẫn chỗ đứng và cách cầm dùi."}, {"en": "One pupil asked, “Do you play the same music at every event?” The host said that the music can **depend on the occasion**. He asked us to **listen for changes** in the **rhythm** while two local players performed together.", "vi": "Một học sinh hỏi: “Các chú có chơi cùng một bản nhạc ở mọi sự kiện không ạ?” Chú nói âm nhạc có thể thay đổi tùy dịp. Chú bảo chúng tôi nghe xem nhịp điệu thay đổi thế nào khi hai người biểu diễn địa phương cùng chơi."}, {"en": "When we returned, our teacher asked what we had learned. Instead of describing the gong only as an object, we talked about how the musicians **play in time** and listen to each other. The second part was what I remembered most.", "vi": "Khi trở về, cô giáo hỏi chúng tôi đã học được gì. Thay vì chỉ mô tả chiếc cồng như một đồ vật, chúng tôi nói về cách các nhạc công chơi đúng nhịp và lắng nghe nhau. Đó là điều tôi nhớ nhất."}], "v": [{"en": "bronze gong", "vi": "cồng bằng đồng", "kind": "colloc", "context": "During an exchange visit in the Central Highlands, we saw a large bronze gong in a community hall. There were several instruments in the room, but our host chose one to show us first. “What happens if I hit it hard?” a classmate asked.", "contextvi": "Trong chuyến giao lưu ở Tây Nguyên, chúng tôi thấy một chiếc cồng bằng đồng lớn trong nhà sinh hoạt cộng đồng. Trong phòng có vài nhạc cụ, nhưng chủ nhà chọn một chiếc để giới thiệu trước. Một bạn hỏi: “Nếu cháu đánh mạnh thì sẽ thế nào ạ?”", "example": "The museum displayed a bronze gong.", "examplevi": "Bảo tàng trưng bày một chiếc cồng bằng đồng."}, {"en": "struck the gong", "vi": "đã đánh cồng", "kind": "colloc", "context": "Our host struck the gong gently. We listened until the sound faded. Then he played it a little harder so we could compare the sounds. He let us try only after showing us where to stand and how to hold the stick.", "contextvi": "Chủ nhà đánh nhẹ vào chiếc cồng. Chúng tôi lắng nghe cho đến khi âm thanh tắt dần. Sau đó, chú đánh mạnh hơn một chút để chúng tôi so sánh. Chú chỉ cho chúng tôi thử sau khi hướng dẫn chỗ đứng và cách cầm dùi.", "example": "The host struck the gong to show us how it sounded.", "examplevi": "Chủ nhà đã đánh cồng để chúng tôi nghe thử âm thanh."}, {"en": "depend on the occasion", "vi": "tùy dịp", "kind": "colloc", "context": "One pupil asked, “Do you play the same music at every event?” The host said that the music can depend on the occasion. He asked us to listen for changes in the rhythm while two local players performed together.", "contextvi": "Một học sinh hỏi: “Các chú có chơi cùng một bản nhạc ở mọi sự kiện không ạ?” Chú nói âm nhạc có thể thay đổi tùy dịp. Chú bảo chúng tôi nghe xem nhịp điệu thay đổi thế nào khi hai người biểu diễn địa phương cùng chơi.", "example": "The choice of music can depend on the occasion.", "examplevi": "Việc chọn nhạc có thể tùy dịp."}, {"en": "listen for changes", "vi": "lắng nghe để nhận ra thay đổi", "kind": "colloc", "context": "One pupil asked, “Do you play the same music at every event?” The host said that the music can depend on the occasion. He asked us to listen for changes in the rhythm while two local players performed together.", "contextvi": "Một học sinh hỏi: “Các chú có chơi cùng một bản nhạc ở mọi sự kiện không ạ?” Chú nói âm nhạc có thể thay đổi tùy dịp. Chú bảo chúng tôi nghe xem nhịp điệu thay đổi thế nào khi hai người biểu diễn địa phương cùng chơi.", "example": "During the performance, listen for changes in speed.", "examplevi": "Khi xem biểu diễn, hãy lắng nghe để nhận ra thay đổi về tốc độ."}, {"en": "play in time", "vi": "chơi đúng nhịp", "kind": "colloc", "context": "When we returned, our teacher asked what we had learned. Instead of describing the gong only as an object, we talked about how the musicians play in time and listen to each other. The second part was what I remembered most.", "contextvi": "Khi trở về, cô giáo hỏi chúng tôi đã học được gì. Thay vì chỉ mô tả chiếc cồng như một đồ vật, chúng tôi nói về cách các nhạc công chơi đúng nhịp và lắng nghe nhau. Đó là điều tôi nhớ nhất.", "example": "The young musicians practised until they could play in time.", "examplevi": "Các nhạc công trẻ luyện tập đến khi có thể chơi đúng nhịp."}, {"en": "gently", "vi": "nhẹ nhàng", "kind": "vocab", "context": "Our host struck the gong gently. We listened until the sound faded. Then he played it a little harder so we could compare the sounds. He let us try only after showing us where to stand and how to hold the stick.", "contextvi": "Chủ nhà đánh nhẹ vào chiếc cồng. Chúng tôi lắng nghe cho đến khi âm thanh tắt dần. Sau đó, chú đánh mạnh hơn một chút để chúng tôi so sánh. Chú chỉ cho chúng tôi thử sau khi hướng dẫn chỗ đứng và cách cầm dùi.", "example": "Tap the drum gently.", "examplevi": "Hãy gõ trống nhẹ nhàng."}, {"en": "rhythm", "vi": "nhịp điệu", "kind": "vocab", "context": "One pupil asked, “Do you play the same music at every event?” The host said that the music can depend on the occasion. He asked us to listen for changes in the rhythm while two local players performed together.", "contextvi": "Một học sinh hỏi: “Các chú có chơi cùng một bản nhạc ở mọi sự kiện không ạ?” Chú nói âm nhạc có thể thay đổi tùy dịp. Chú bảo chúng tôi nghe xem nhịp điệu thay đổi thế nào khi hai người biểu diễn địa phương cùng chơi.", "example": "Can you follow the rhythm?", "examplevi": "Bạn có y", "How much"], ["________ you play this instrument at every event?", "Do", "Is", "Does"]], "wf": [["perform", "performance", "We thanked the musicians after their ________."], ["music", "musicians", "Two local ________ played together."]], "chunks": [["During an exchange visit in the Central Highlands, we saw a large bronze gong in a community hall.", "Trong chuyến giao lưu ở Tây Nguyên, chúng tôi thấy một chiếc cồng bằng đồng lớn trong nhà sinh hoạt cộng đồng.", ["During an exchange visit", "in the Central Highlands,", "we saw a large", "bronze gong", "in a community hall."]], ["There were several instruments in the room, but our host chose one to show us first.", "Trong phòng có vài nhạc cụ, nhưng chủ nhà chọn một chiếc để giới thiệu trước.", ["There were several instruments", "in the room,", "but our host chose", "one to show us first."]], ["Then he played it a little harder so we could compare the sounds.", "Sau đó, chú đánh mạnh hơn một chút để chúng tôi so sánh.", ["Then he played it", "a little harder", "so we could compare", "the sounds."]], ["He let us try only after showing us where to stand and how to hold the stick.", "Chú chỉ cho chúng tôi thử sau khi hướng dẫn chỗ đứng và cách cầm dùi.", ["He let us try", "only after showing us", "where to stand", "and how to hold", "the stick."]], ["One pupil asked, “Do you play the same music at every event?” The host said that the music can depend on the occasion.", "Một học sinh hỏi: “Các chú có chơi cùng một bản nhạc ở mọi sự kiện không ạ?” Chú nói âm nhạc có thể thay đổi tùy dịp.", ["One pupil asked,", "“Do you play the", "same music", "at every event?” The", "host said that the", "music can", "depend on the occasion."]], ["He asked us to listen for changes in the rhythm while two local players performed together.", "Chú bảo chúng tôi nghe xem nhịp điệu thay đổi thế nào khi hai người biểu diễn địa phương cùng chơi.", ["He asked us to", "listen for changes", "in the rhythm", "while two local players", "performed together."]], ["When we returned, our teacher asked what we had learned.", "Khi trở về, cô giáo hỏi chúng tôi đã học được gì.", ["When we returned,", "our teacher asked what", "we had learned."]], ["Instead of describing the gong only as an object, we talked about how the musicians play in time and listen to each other.", "Thay vì chỉ mô tả chiếc cồng như một đồ vật, chúng tôi nói về cách các nhạc công chơi đúng nhịp và lắng nghe nhau.", ["Instead of describing the", "gong only as an", "object, we talked about", "how the musicians", "play in time", "and listen to each other."]]], "output": ["What instrument would you like to try?", "Why do musicians need to listen to each other?", "What would you include in a report about a performance?", "Write 70–90 words about a performance you have seen. Describe what you noticed and one thing you would ask a performer."], "models": ["I would like to try the drums. I would listen to the teacher first and practise a short rhythm slowly.", "They need to know when the others slow down or stop. Listening helps the whole group play in time.", "I would describe the instruments and explain what changed during the performance. I would also mention one thing that surprised me."], "drills": [["The museum displayed a ________.", "bronze gong"], ["The host ________ to show us how it sounded.", "struck the gong"], ["The choice of music can ________.", "depend on the occasion"], ["During the performance, ________ in speed.", "listen for changes"], ["The young musicians practised until they could ________.", "play in time"]]}, {"id": 19, "ch": 4, "title": "Planning a Culture Display", "genre": "Interview", "p": [{"en": "Reporter: Why is your group putting together a **culture display**?\nAn: We want visitors to see how objects are used in everyday life. There are a few things we can **borrow** from our families, but we must ask first.", "vi": "Phóng viên: Tại sao nhóm bạn chuẩn bị một góc trưng bày văn hóa?\nAn: Chúng mình muốn khách xem các đồ vật được sử dụng trong đời sống ra sao. Có vài món chúng mình có thể mượn từ gia đình, nhưng phải hỏi trước."}, {"en": "Reporter: What will you **put on display**?\nAn: A basket, two pieces of cloth and some photographs. The basket belongs to my aunt. She uses it to carry vegetables from the garden.", "vi": "Phóng viên: Bạn sẽ đem trưng bày những gì?\nAn: Một chiếc giỏ, hai mảnh vải và vài bức ảnh. Chiếc giỏ của dì mình. Dì dùng nó để mang rau từ vườn về."}, {"en": "Reporter: How will people find out about the objects?\nAn: We’ll **write short labels** for each one. Our group has also asked the owners to **share a memory** about using them. One sentence is enough if it tells a clear story.", "vi": "Phóng viên: Mọi người sẽ tìm hiểu về các đồ vật bằng cách nào?\nAn: Chúng mình sẽ viết nhãn ngắn cho từng món. Nhóm cũng nhờ các chủ đồ vật chia sẻ một kỷ niệm gắn với việc sử dụng chúng. Một câu là đủ nếu câu đó kể được một câu chuyện rõ ràng."}, {"en": "Reporter: Do you need more **volunteers**?\nAn: Yes. We need someone to meet guests and answer questions. We also need a person to check that we **return borrowed items** to the right families.", "vi": "Phóng viên: Các bạn có cần thêm tình nguyện viên không?\nAn: Có. Chúng mình cần một bạn đón khách và trả lời câu hỏi. Chúng mình cũng cần một người kiểm tra xem đồ đã mượn được trả về đúng gia đình chưa."}], "v": [{"en": "culture display", "vi": "góc trưng bày văn hóa", "kind": "colloc", "context": "Reporter: Why is your group putting together a culture display?\nAn: We want visitors to see how objects are used in everyday life. There are a few things we can borrow from our families, but we must ask first.", "contextvi": "Phóng viên: Tại sao nhóm bạn chuẩn bị một góc trưng bày văn hóa?\nAn: Chúng mình muốn khách xem các đồ vật được sử dụng trong đời sống ra sao. Có vài món chúng mình có thể mượn từ gia đình, nhưng phải hỏi trước.", "example": "Our school set up a culture display in the hall.", "examplevi": "Trường chún n": "return borrowed items", "vi": "trả lại đồ đã mượn", "kind": "colloc", "context": "Reporter: Do you need more volunteers?\nAn: Yes. We need someone to meet guests and answer questions. We also need a person to check that we return borrowed items to the right families.", "contextvi": "Phóng viên: Các bạn có cần thêm tình nguyện viên không?\nAn: Có. Chúng mình cần một bạn đón khách và trả lời câu hỏi. Chúng mình cũng cần một người kiểm tra xem đồ đã mượn được trả về đúng gia đình chưa.", "example": "Please return borrowed items when the lesson ends.", "examplevi": "Vui lòng trả lại đồ đã mượn khi buổi học kết thúc."}, {"en": "borrow", "vi": "mượn", "kind": "vocab", "context": "Reporter: Why is your group putting together a culture display?\nAn: We want visitors to see how objects are used in everyday life. There are a few things we can borrow from our families, but we must ask first.", "contextvi": "Phóng viên: Tại sao nhóm bạn chuẩn bị một góc trưng bày văn hóa?\nAn: Chúng mình muốn khách xem các đồ vật được sử dụng trong đời sống ra sao. Có vài món chúng mình có thể mượn từ gia đình, nhưng phải hỏi trước.", "example": "We may borrow two books this week.", "examplevi": "Tuần này chúng tôi có thể mượn hai cuốn sách."}, {"en": "volunteers", "vi": "tình nguyện viên", "kind": "vocab", "context": "Reporter: Do you need more volunteers?\nAn: Yes. We need someone to meet guests and answer questions. We also need a person to check that we return borrowed items to the right families.", "contextvi": "Phóng viên: Các bạn có cần thêm tình nguyện viên không?\nAn: Có. Chúng mình cần một bạn đón khách và trả lời câu hỏi. Chúng mình cũng cần một người kiểm tra xem đồ đã mượn được trả về đúng gia đình chưa.", "example": "The volunteers welcomed our class.", "examplevi": "Các tình nguyện viên đón lớp chúng tôi."}], "image": "data:image/webp;base64,UklGRqxmAABXRUJQVlA4IKBmAABwJwGdASo+AT4BPkUaikOioaEjLJaN8GAIiU2fw/hgWwK3yjJ5TePyf/P/yHo28k903yT8F62X8zr5+P/7/l3+598//b+rr+lf5z9l/gV/YL1  sao.", ["We want visitors to", "see how objects are", "used in everyday life."]], ["There are a few things we can borrow from our families, but we must ask first.", "Có vài món chúng mình có thể mượn từ gia đình, nhưng phải hỏi trước.", ["There are a few", "things we can borrow", "from our families,", "but we must ask first."]], ["A basket, two pieces of cloth and some photographs.", "Một chiếc giỏ, hai mảnh vải và vài bức ảnh.", ["A basket,", "two pieces of cloth", "and some photographs."]], ["She uses it to carry vegetables from the garden.", "Dì dùng nó để mang rau từ vườn về.", ["She uses it to", "carry vegetables", "from the garden."]], ["We’ll write short labels for each one.", "Chúng mình sẽ viết nhãn ngắn cho từng món.", ["We’ll", "write short labels", "for each one."]], ["Our group has also asked the owners to share a memory about using them.", "Nhóm cũng nhờ các chủ đồ vật chia sẻ một kỷ niệm gắn với việc sử dụng chúng.", ["Our group has also", "asked the owners to", "share a memory", "about using them."]], ["One sentence is enough if it tells a clear story.", "Một câu là đủ nếu câu đó kể được một câu chuyện rõ ràng.", ["One sentence is enough", "if it tells a", "clear story."]]], "output": ["Which object would you lend for a display?", "What should a good display label include?", "Which volunteer job would you choose?", "Write 70–90 words proposing a culture display. List two objects, explain what their labels should say and assign one job."], "models": ["I would lend a market basket my grandmother used. I could write a label explaining when she carried it.", "It should name the object and say how people use it. A short story can make the label easier to remember.", "I would welcome visitors and answer their questions. I like finding out which objects make people curious."], "drills": [["Our school set up a ________ in the hall.", "culture display"], ["Which objects will the students ________?", "put on display"], ["Our group will ________ for the photos.", "write short labels"], ["The host asked each visitor to ________.", "share a memory"], ["Please ________ when the lesson ends.", "return borrowed items"]]}, {"id": 20, "ch": 4, "title": "A Small House, Many Questions", "genre": "School Story", "p": [{"en": "For a school **exhibition**, Minh and Huệ built a **scale model** of a stilt house. They wanted it to show both the building and the jobs people did around it. They borrowed a photograph from a neighbour and asked before using it.", "vi": "Để tham gia triển lãm ở trường, Minh và Huệ làm mô hình nhà sàn theo tỷ lệ. Hai bạn muốn mô hình thể hiện cả công trình và những việc người ta làm xung quanh nhà. Hai bạn mượn một bức ảnh của hàng xóm và xin phép trước khi sử dụng."}, {"en": "Minh was ready to glue the roof on when Huệ asked, “How will visitors see inside?” He stopped and tested a roof that people could lift. They worked together to **solve the problem** without having to rebuild the whole model.", "vi": "Minh chuẩn bị dán mái nhà thì Huệ hỏi: “Khách sẽ nhìn vào bên trong bằng cách nào?” Bạn dừng lại và thử làm một mái có thể nhấc lên được. Hai bạn cùng giải quyết vấn đề mà không phải làm lại toàn bộ mô hình."}, {"en": "Next, they wrote **clear captions**. There was not much space, so they chose short questions instead of long descriptions. One label asked, “How many steps can you count?” Another asked visitors to **compare the two pictures**.", "vi": "Tiếp theo, hai bạn viết chú thích rõ ràng. Vì không có nhiều chỗ, hai bạn chọn câu hỏi ngắn thay cho đoạn mô tả dài. Một nhãn hỏi: “Bạn đếm được bao nhiêu bậc thang?” Một nhãn khác đề nghị khách so sánh hai bức ảnh."}, {"en": "At the exhibition, a younger pupil lifted the roof and found the main room. She asked whether all stilt houses looked the same. Huệ said that designs can **vary** and offered to **look for more examples** with her after class.", "vi": "Tại triển lãm, một em học sinh lớp dưới nhấc mái và tìm thấy gian chính. Em hỏi có phải mọi ngôi nhà sàn đều giống nhau không. Huệ giải thích rằng kiểu nhà có thể khác nhau và đề nghị cùng em tìm thêm ví dụ sau giờ học."}], "v": [{"en": "scale model", "vi": "mô hình theo tỷ lệ", "kind": "colloc", "context": "For a school exhibition, Minh and Huệ built a scale model of a stilt house. They wanted it to show both the building and the jobs people did around it. They borrowed a photograph from a neighbour and asked before using it.", "contextvi": "Để tham gia triển lãm ở trường, Minh và Huệ làm mô hình nhà sàn theo tỷ lệ. Hai bạn muốn mô hình thể hiện cả công trình và những việc người ta làm xung quanh nhà. Hai bạn mượn một bức ảnh của hàng xóm và xin phép trước khi sử dụng.", "example": "The group made a scale model of the bridge.", "examplevi": "Nhóm làm một mô hình cây cầu theo tỷ lệ."}, {"en": "solve the problem", "vi": "giải quyết vấn đề", "kind": "colloc", "context": "Minh was ready to glue the roof on when Huệ asked, “How will visitors see inside?” He stopped and tested a roof that people could lift. They worked together to solve the problem without having to rebuild the whole model.", "contextvi": "Minh chuẩn bị dán mái nhà thì Huệ hỏi: “Khách sẽ nhìn vào bên trong bằng cách nào?” Bạn dừng lại và thử làm một mái có thể nhấc lên được. Hai bạn cùng giải quyết vấn đề mà không phải làm lại toàn bộ mô hình.", "example": "They changed the plan to solve the problem.", "examplevi": "Họ đổi kế hoạch để giải quyết vấn đề."}, {"en": "clear captions", "vi": "chú thích rõ ràng", "kind": "colloc", "context": "Next, they wrote clear captions. There was not much space, so they chose short questions instead of long descriptions. One label asked, “How many steps can you count?” Another asked visitors to compare the two pictures.", "contextvi": "Tiếp theo, hai bạn viết chú thích rõ ràng. Vì không có nhiều chỗ, hai bạn chọn câu hỏi ngắn thay cho đoạn mô tả dài. Một nhãn hỏi: “Bạn đếm được bao nhiêu bậc thang?” Một nhãn khác đề nghị khách so sánh hai bức ảnh.", "example": "The photos were easier to understand with clear captions.", "examplevi": "Những bức ảnh dễ hiểu hơn nhờ chú thích rõ ràng."}, {"en": "compare the two pictures", "vi": "so sánh hai bức ảnh", "kind": "colloc", "context": "Next, they wrote clear captions. There was not much space, so they chose short questions instead of long descriptions. One label asked, “How many steps can you count?” Another asked visitors to compare the two pictures.", "contextvi": "Tiếp theo, hai bạn viết chú thích rõ ràng. Vì không có nhiều chỗ, hai bạn chọn câu hỏi ngắn thay cho đoạn mô tả dài. Một nhãn hỏi: “Bạn đếm được bao nhiêu bậc thang?” Một nhãn khác đề nghị khách so sánh hai bức ảnh.", "example": "Can you compare the two pictures and find one difference?", "examplevi": "Bạn có thể so sánh hai bức ảnh và tìm một điểm khác nhau không?"}, {"en": "look for more examples", "vi": "tìm thêm ví dụ", "kind": "colloc", "context": "At the exhibition, a younger pupil lifted the roof and found the main room. She asked whether all stilt houses looked the same. Huệ said that designs can vary and offered to look for more examples with her after class.", "contextvi": "Tại triển lãm, một em học sinh lớp dưới nhấc mái và tìm thấy gian chính. Em hỏi có phải mọi ngôi nhà sàn đều giống nhau không. Huệ giải thích rằng kiểu nhà có thể khác nhau và đề nghị cùng em tìm thêm ví dụ sau giờ học.", "example": "We can look for more examples at the library.", "examplevi": "Chúng ta có thể tìm thêm ví dụ ở thư viện."}, {"en": "exhibition", "vi": "triển lãm", "kind": "vocab", "context": "For a school exhibition, Minh and Huệ built a scale model of a stilt house. They wanted it to show both the building and the jobs people did around it. They borrowed a photograph from a neighbour and asked before using it.", "contextvi": "Để tham gia triển lãm ở trường, Minh và Huệ làm mô hình nhà sàn theo tỷ lệ. Hai bạn muốn mô hình thể hiện cả công trình và những việc người ta làm xung quanh nhà. Hai bạn mượn một bức ảnh của hàng xóm và xin phép trước khi sử dụng.", "example": "We saw a model at the exhibition.", "examplevi": "Chúng tôi thấy một mô hình tại triển lãm."}, {"en": "vary", "vi": "khác nhau", "kind": "vocab", "context": "At the exhibition, a younger pupil lifted the roof and found the main room. She asked whether all stilt houses looked the same. Huệ said that designs can vary and offered to look for more examples with her after class.", "contextvi": "Tại triển lãm, một em học sinh lớp dưới nhấc mái và tìm thấy gian chính. Em hỏi có phải mọi ngôi nhà sàn đều giống nhau không. Huệ giải thích rằng kiểu nhà có thể khác nhau và đề nghị cùng em tìm thêm ví dụ sau giờ học.", "example": "The colours can vary from one design to another.", "examplevi": "Màu sắc có thể khác nhau tùy theo từng thiết kế."}], "image": "data:image/webp;base64,UklGRqR2AABXRUJQVlA4IJh2AADQOwGdASo+AT4BPkUai0QioaElrDW8sLAIiUEOAC08XrXn2A8Ifff5H90PZo5l8Mvqn4r16/8XU/8r/0/L09+/p/mZ+cH/B9XP9T/3XsO/1X/Hf7v2Tf+v1tf4H/veqD+r/779yveZ/7nri/xfqJ/2L/SeuZ6s/oe+dD/9faE/wv/k/d32zPUA///tzc6PEh5TflPyH80/yX6H/Kf3f/Gf7f+/e43kj7D/9f0F/l/4l/d/4X94vZH/d/mX6A/nH7d/uv8j+8f+X+Q78k/m/9+/s37d/3f98vqx+h/3v+k8DDZv9N/zf9b7Bfsf9K/zX96/zn/g/wPwkfc/+z0t/e/83/4PcC/pn90/5/+G9t//B4ln4X/p+wJ/Wf9F/8/Zs/vP/V/rf+B+4vu5/TP9D/4/9B8Bf8x/sv/B/w/+d/+n+W/////8p/pSohAqtszrdSsnqOn30mkv7KT8WuJXtRHyP8SB9rhGdShrMCXSkWV1QgI5n/TlEZF4O37codNpoT7cy4B2oM/DBxrqFfs1JJKJA6i3Sy5nHKs22EW8R2pReQ0WS3+SJY3SS7SygbhQejYpzxtsE4Gio3mS2LXr4AZ3iqs6OJacFqMskSxaBOkE/Stfpcbdnjvu5FunwjIog3PvnqDNWe3MphjdKxvmdIfh/iFG2mVv3fM1gUAAflSZGFgaqb8aGMBNC5lyyci/hUsvkW1wZUzwOsN2e7bM9Ezms1PXKa1ZHh+uakq887v748Yr2cpjsAJHkcuLLWOm4DFNI2GjM7qDqL9pSnWIPY+LR1exIjYz6MioGsgEmbfMdH9KaQKNo3sEKNUlCDRRBO9WercVIXncYw0wOezZN57oEBNL2H+OB1dmXwOGZctUpMmMWuDvbD8pYW3KtK9pCMScLqXvzPOIVw3F7bN1DnoNjHYh360hrkxhAUpJTNDVYFWIbOCJhilJMjzL62N+yyTD1T7j9UZ6ZKkij/BC5+cFlWjbuIw4UpaLkan1H4Xsm7t84sZj9r0N37NOyNhx40+jtlds2EY31divYln2m5LWSYMD8uUFQdBz8+0Vq2RwWPLocKyIQSd7jSJZn/gqbsDbl0+4uk7j9qmigHTkMqZQ56zRffFs1SD0km8a0DJ7syEJCn0pzowqD5LRTAYeWPTW7wPhizw ["compare", "comparison", "A ________ of the photos shows several differences."], ["exhibit", "exhibition", "The model was on show at a school ________."]], "chunks": [["For a school exhibition, Minh and Huệ built a scale model of a stilt house.", "Để tham gia triển lãm ở trường, Minh và Huệ làm mô hình nhà sàn theo tỷ lệ.", ["For a school exhibition,", "Minh and Huệ built", "a", "scale model", "of a stilt house."]], ["They wanted it to show both the building and the jobs people did around it.", "Hai bạn muốn mô hình thể hiện cả công trình và những việc người ta làm xung quanh nhà.", ["They wanted it to", "show both the building", "and the jobs people", "did around it."]], ["They borrowed a photograph from a neighbour and asked before using it.", "Hai bạn mượn một bức ảnh của hàng xóm và xin phép trước khi sử dụng.", ["They borrowed a photograph", "from a neighbour", "and asked", "before using it."]], ["They worked together to solve the problem without having to rebuild the whole model.", "Hai bạn cùng giải quyết vấn đề mà không phải làm lại toàn bộ mô hình.", ["They worked together to", "solve the problem", "without having to rebuild", "the whole model."]], ["There was not much space, so they chose short questions instead of long descriptions.", "Vì không có nhiều chỗ, hai bạn chọn câu hỏi ngắn thay cho đoạn mô tả dài.", ["There was not much", "space, so they chose", "short questions instead of", "long descriptions."]], ["One label asked, “How many steps can you count?” Another asked visitors to compare the two pictures.", "Một nhãn hỏi: “Bạn đếm được bao nhiêu bậc thang?” Một nhãn khác đề nghị khách so sánh hai bức ảnh.", ["One label asked,", "“How many steps can", "you count?” Another asked", "visitors to", "compare the two pictures."]], ["At the exhibition, a younger pupil lifted the roof and found the main room.", "Tại triển lãm, một em học sinh lớp dưới nhấc mái và tìm thấy gian chính.", ["At the exhibition,", "a younger pupil lifted", "the roof", "and found the main room."]], ["Huệ said that designs can vary and offered to look for more examples with her after class.", "Huệ giải thích rằng kiểu nhà có thể khác nhau và đề nghị cùng em tìm thêm ví dụ sau giờ học.", ["Huệ said that designs", "can vary", "and offered to", "look for more examples", "with her", "after class."]]], "output": ["What model would you make for an exhibition?", "Why use questions on labels?", "What would you do if you could not find an answer for a visitor?", "Write 70–90 words explaining how you would improve a model for a school exhibition."], "models": ["I would make a small market stall. Visitors could lift the roof and move the tiny baskets.", "A good question gives visitors something to look for. They may spend more time noticing details.", "I would say I needed to check. Then I would look for another example with the visitor."], "drills": [["The group made a ________ of the bridge.", "scale model"], ["They changed the plan to ________.", "solve the problem"], ["The photos were easier to understand with ________.", "clear captions"], ["Can you ________ and find one difference?", "compare the two pictures"], ["We can ________ at the library.", "look for more examples"]]}, {"id": 21, "ch": 5, "title": "A Square Cake for Tet", "genre": "Personal Experience", "p": [{"en": "Every year before Tet, my family gets together to **make square sticky rice cakes**. This time, my grandmother let me prepare a cake myself. First, I washed the leaves and counted four pieces of string. There was a bowl of rice on the table.", "vi": "Mỗi năm trước Tết, gia đình tôi quây quần làm bánh chưng. Lần này, bà cho tôi tự chuẩn bị một chiếc. Đầu tiên, tôi rửa lá và đếm bốn sợi lạt. Trên bàn có một bát gạo."}, {"en": "Grandmother showed me how to **wrap the filling** so it stayed in the middle. The first cake was loose at one corner. She asked me to open it and try again. We decided to **tie the string** only after the sides looked even.", "vi": "Bà chỉ tôi cách gói nhân để nhân nằm ở giữa. Chiếc bánh đầu tiên bị lỏng ở một góc. Bà bảo tôi mở ra và thử lại. Chúng tôi quyết định buộc lạt sau khi các cạnh đã đều."}, {"en": "Later, we set the cakes in a large pot. While they cooked, I asked why she always made **extra**. “We **give some away**,” she said. “Your uncle has just moved, so we’ll take a cake to him tomorrow.”", "vi": "Sau đó, chúng tôi xếp bánh vào một chiếc nồi lớn. Trong lúc nấu bánh, tôi hỏi sao bà luôn gói thêm. “Nhà mình đem biếu một ít,” bà nói. “Chú con mới chuyển nhà, nên mai mình sẽ mang một chiếc cho chú.”"}, {"en": "The next morning, I could recognise my cake by the string I had tied. It was still a little **uneven**. We laughed and put it aside to share at home. Helping to prepare a meal was a good way for me to **take part in the tradition**.", "vi": "Sáng hôm sau, tôi nhận ra bánh của mình nhờ sợi lạt đã buộc. Bánh vẫn hơi lệch. Chúng tôi bật cười và để riêng chiếc đó để cả nhà cùng ăn. Giúp chuẩn bị món ăn là cách để tôi tham gia vào truyền thống gia đình."}], "v": [{"en": "make square sticky rice cakes", "vi": "làm bánh chưng", "kind": "colloc", "context": "Every year before Tet, my family gets together to make square sticky rice cakes. This time, my grandmother let me prepare a cake myself. First, I washed the leaves and counted four pieces of string. There was a bowl of rice on the table.", "contextvi": "Mỗi năm trước Tết, gia đình tôi quây quần làm bánh chưng. Lần này, bà cho tôi tự chuẩn bị một chiếc. Đầu tiên, tôi rửa lá và đếm bốn sợi lạt. Trên bàn có một bát gạo.", "example": "We get together to make square sticky rice cakes before Tet.", "examplevi": "Chúng tôi quây quần làm bánh chưng trước Tết."}, {"en": "wrap the filling", "vi": "gói phần nhân", "kind": "colloc", "context": "Grandmother showed me how to wrap the filling so it stayed in the middle. The first cake was loose at one corner. She asked me to open it and try again. We decided to tie the string only after the sides looked even.", "contextvi": "Bà chỉ tôi cách gói nhân để nhân nằm ở giữa. Chiếc bánh đầu tiên bị lỏng ở một góc. Bà bảo tôi mở ra và thử lại. Chúng tôi quyết định buộc lạt sau khi các cạnh đã đều.", "example": "Please show me how to wrap the filling without leaving a gap.", "examplevi": "Hãy chỉ tôi cách gói phần nhân sao cho không có khe hở."}, {"en": "tie the string", "vi": "buộc lạt", "kind": "colloc", "context": "Grandmother showed me how to wrap the filling so it stayed in the middle. The first cake was loose at one corner. She asked me to open it and try again. We decided to tie the string only after the sides looked even.", "contextvi": "Bà chỉ tôi cách gói nhân để nhân nằm ở giữa. Chiếc bánh đầu tiên bị lỏng ở một góc. Bà bảo tôi mở ra và thử lại. Chúng tôi quyết định buộc lạt sau khi các cạnh đã đều.", "example": "Hold the leaves still while I tie the string.", "examplevi": "Giữ lá cho khỏi xê dịch trong lúc tôi buộc lạt."}, {"en": "give some away", "vi": "đem biếu một ít", "kind": "colloc", "context": "Later, we set the cakes in a large pot. While they cooked, I asked why she always made extra. “We give some away,” she said. “Your uncle has just moved, so we’ll take a cake to him tomorrow.”", "contextvi": "Sau đó, chúng tôi xếp bánh vào một chiếc nồi lớn. Trong lúc nấu bánh, tôi hỏi sao bà luôn gói thêm. “Nhà mình đem biếu một ít,” bà nói. “Chú con mới chuyển nhà, nên mai mình sẽ mang một chiếc cho chú.”", "example": "When we cook more than we need, we give some away.", "examplevi": "Khi nấu nhiều hơn mức cần thiết, chúng tôi đem biếu một ít."}, {"en": "take part in the tradition", "vi": "tham gia vào truyền thống", "kind": "colloc", "context": "The next morning, I could recognise my cake by the string I had tied. It was still a little uneven. We laughed and put it aside to share at home. Helping to prepare a meal was a good way for me to take part in the tradition.", "contextvi": "Sáng hôm sau, tôi nhận ra bánh của mình nhờ sợi lạt đã buộc. Bánh vẫn hơi lệch. Chúng tôi bật cười và để riêng chiếc đó để cả nhà cùng ăn. Giúp chuẩn bị món ăn là cách để tôi tham gia vào truyền thống gia đình.", "example": "Helping with the meal is a way to take part in the tradition.", "examplevi": "Giúp chuẩn bị bữa ăn là một cách tham gia vào truyền thống."}, {"en": "uneven", "vi": "không đều", "kind": "vocab", "context": "The next morning, I could recognise my cake by the string I had tied. It was still a little uneven. We laughed and put it aside to share at home. Helping to prepare a meal was a good way for me to take part in the tradition.", "contextvi": "Sáng hôm sau, tôi nhận ra bánh của mình nhờ sợi lạt đã buộc. Bánh vẫn hơi lệch. Chúng tôi bật cười và để riêng chiếc đó để cả nhà cùng ăn. Giúp chuẩn bị món ăn là cách để tôi tham gia vào truyền thống gia đình.", "example": "One side of the cake looks uneven.", "examplevi": "Một cạnh của chiếc bánh trông không đều."}, {"en": "extra", "vi": "thêm", "kind": "vocab", "context": "Later, we set the cakes in a large pot. While they cooked, I asked why she always made extra. “We give some away,” she said. “Your uncle has just moved, so we’ll take a cake to him tomorrow.”", "contextvi": "Sau đó, chúng tôi xếp bánh vào một chiếc nồi lớn. Trong lúc nấu bánh, tôi hỏi sao bà luôn gói thêm. “Nhà mình đem biếu một ít,” bà nói. “Chú con mới chuyển nhà, nên mai mình sẽ mang một chiếc cho chú.”", "example": "We made extra food for our neighbours.", "examplevi": "Chúng tôi nấu thêm đồ ăn cho hàng xóm."}], "image": "data:image/webp;base64,UklGRpBvAABXRUJQVlA4IIRvAADQSgGdASo+AT0BPkUai0QioaEVut7UKAREoAt3pc2L9XPDz7Pmqcg9uvyT796x39HrM+H/6/mL+0d8f/merD9Pf/D3Cf129Uf/i9d3+J/8/qu/cn9zved/7f7d+/T/M+o9/bv+r1sHoZ/ul6eXs5f1//velz///YA///tv8uPAZ5O/wfBf8n+of0n97/0H/Y/yHukY6+y3UU+Z/kz+R/i/SD/sf6Xx7+Sn+z/m/yp+Q78p/n3+r/wH7p/475EPt//D39duf/V/qPYa92vs//D/xP5S/Gz+X53/wv+t9gX84+Q69f9gf9Uerr/mf/T/Z/7v1l/Vf/x/0P+y+Q3+df3D/n/4v/R/tD88v//95X7uf//3kv3c//6I92QzBNr9oDeogGT4sz+6nH1/cz3pn5re/nxSRTkwG+kS8PdAvsPcfQG24Tt7ggVA+3zCoXo4PYmCIvCR0fEbO8uzL/Cp ing they had tied", "By its red leaves", "By a note under it"]], "gr": [["There was ________ bowl of rice on the table.", "a", "an", "Ø"], ["They are making cakes for ________ Tet.", "Ø", "a", "an"]], "wf": [["fill", "filling", "The ________ should stay in the middle of the cake."], ["prepare", "preparations", "We made all the ________ before the guests arrived."]], "chunks": [["Every year before Tet, my family gets together to make square sticky rice cakes.", "Mỗi năm trước Tết, gia đình tôi quây quần làm bánh chưng.", ["Every year", "before Tet,", "my family gets together", "to", "make square sticky rice cakes."]], ["This time, my grandmother let me prepare a cake myself.", "Lần này, bà cho tôi tự chuẩn bị một chiếc.", ["This time,", "my grandmother let me", "prepare a cake myself."]], ["First, I washed the leaves and counted four pieces of string.", "Đầu tiên, tôi rửa lá và đếm bốn sợi lạt.", ["First, I washed the", "leaves and counted four", "pieces of string."]], ["There was a bowl of rice on the table.", "Trên bàn có một bát gạo.", ["There was a bowl", "of rice", "on the table."]], ["Grandmother showed me how to wrap the filling so it stayed in the middle.", "Bà chỉ tôi cách gói nhân để nhân nằm ở giữa.", ["Grandmother showed me how", "to", "wrap the filling", "so it stayed", "in the middle."]], ["She asked me to open it and try again.", "Bà bảo tôi mở ra và thử lại.", ["She asked me to", "open it", "and try again."]], ["We decided to tie the string only after the sides looked even.", "Chúng tôi quyết định buộc lạt sau khi các cạnh đã đều.", ["We decided to", "tie the string", "only after the sides", "looked even."]], ["While they cooked, I asked why she always made extra.", "Trong lúc nấu bánh, tôi hỏi sao bà luôn gói thêm.", ["While they cooked,", "I asked why she", "always made extra."]]], "output": ["What job would you choose when making cakes?", "Why might a family make extra food?", "What can you learn from making food with an older relative?", "Write 70–90 words about a food your family prepares for a special occasion. Describe two steps and explain who helps."], "models": ["I would wash and sort the leaves. That is a task I could do carefully even as a beginner.", "They might plan to share it with friends or relatives. A small gift gives them a reason to visit and talk.", "I can learn to do things in the right order. I can also ask where the recipe came from."], "drills": [["We get together to ________ before Tet.", "make square sticky rice cakes"], ["Please show me how to ________ without leaving a gap.", "wrap the filling"], ["Hold the leaves still while I ________.", "tie the string"], ["When we cook more than we need, we ________.", "give some away"], ["Helping with the meal is a way to ________.", "take part in the tradition"]]}, {"id": 22, "ch": 5, "title": "A First Visit at Tet", "genre": "Personal Experience", "p": [{"en": "Linh had spent Tet in the city for several years. This time, she travelled with her father to **visit older relatives**. At the gate, he handed her a small box of tea and reminded her to greet everyone before giving the gift.", "vi": "Linh đã đón Tết ở thành phố vài năm. Lần này, em cùng bố đi thăm họ hàng lớn tuổi. Ở cổng, bố đưa em một hộp trà nhỏ và nhắc em chào mọi người trước khi tặng quà."}, {"en": "Linh had practised one greeting on the bus. When her **great-aunt** opened the door, Linh smiled and **wished her good health**. Her great-aunt thanked her and led them into a bright room with flowers on the table.", "vi": "Linh đã tập một lời chúc trên xe buýt. Khi bà dì mở cửa, Linh mỉm cười và chúc bà mạnh khỏe. Bà cảm ơn em rồi dẫn hai bố con vào một căn phòng sáng, trên bàn có hoa."}, {"en": "Before pouring tea, Linh offered to **help set the table**. Her great-aunt gave her some small cups. As she put them out, Linh noticed an old clock and asked about it. The question led to a story about the house before her father was born.", "vi": "Trước khi rót trà, Linh đề nghị giúp bày bàn. Bà dì đưa em vài chiếc chén nhỏ. Trong lúc bày chén, Linh để ý một chiếc đồng hồ cũ và hỏi về nó. Câu hỏi dẫn đến một câu chuyện về ngôi nhà trước khi bố em ra đời."}, {"en": "Linh had worried about saying the right words, but she soon felt **comfortable**. She knew that during a **family visit**, she could also **show respect** by listening and helping. On the way home, she told her father she hoped to visit again.", "vi": "Linh từng lo mình nói không đúng lời, nhưng em sớm thấy thoải mái. Em hiểu trong một chuyến thăm họ hàng, mình còn có thể thể hiện sự kính trọng bằng cách lắng nghe và giúp đỡ. Trên đường về, em nói với bố rằng em mong sẽ quay lại."}], "v": [{"en": "visit older relatives", "vi": "thăm họ hàng lớn tuổi", "kind": "colloc", "context": "Linh had spent Tet in the city for several years. This time, she travelled with her father to visit older relatives. At the gate, he handed her a small box of tea and reminded her to greet everyone before giving the gift.", "contextvi": "Linh đã đón Tết ở thành phố vài năm. Lần này, em cùng bố đi thăm họ hàng lớn tuổi. Ở cổng, bố đưa em một hộp trà nhỏ và nhắc em chào mọi người trước khi tặng quà.", "example": "We often visit older relatives at the start of the holiday.", "examplevi": "Chúng tôi thường thăm họ hàng lớn tuổi khi kỳ nghỉ bắt đầu."}, {"en": "wished her good health", "vi": "đã chúc bà mạnh khỏe", "kind": "colloc", "context": "Linh had practised one greeting on the bus. When her great-aunt opened the door, Linh smiled and wished her good health. Her great-aunt thanked her and led them into a bright room with flowers on the table.", "contextvi": "Linh đã tập một lời chúc trên xe buýt. Khi bà dì mở cửa, Linh mỉm cười và chúc bà mạnh khỏe. Bà cảm ơn em rồi dẫn hai bố con vào một căn phòng sáng, trên bàn có hoa.", "example": "Linh smiled and wished her good health.", "examplevi": "Linh mỉm cười và chúc bà mạnh khỏe."}, {"en": "help set the table", "vi": "giúp bày bàn", "kind": "colloc", "context": "Before pouring tea, Linh offered to help set the table. Her great-aunt gave her some small cups. As she put them out, Linh noticed an old clock and asked about it. The question led to a story about the house before her father was born.", "contextvi": "Trước khi rót trà, Linh đề nghị giúp bày bàn. Bà dì đưa em vài chiếc chén nhỏ. Trong lúc bày chén, Linh để ý một chiếc đồng hồ cũ và hỏi về nó. Câu hỏi dẫn đến một câu chuyện về ngôi nhà trước khi bố em ra đời.", "example": "May I help set the table before the guests arrive?", "examplevi": "Cháu có thể giúp bày bàn trước khi khách đến không ạ?"}, {"en": "family visit", "vi": "chuyến thăm họ hàng", "kind": "colloc", "context": "Linh had worried about saying the right words, but she soon felt comfortable. She knew that during a family visit, she could also show respect by listening and helping. On the way home, she told her father she hoped to visit again.", "contextvi": "Linh từng lo mình nói không đúng lời, nhưng em sớm thấy thoải mái. Em hiểu trong một chuyến thăm họ hàng, mình còn có thể thể hiện sự kính trọng bằng cách lắng nghe và giúp đỡ. Trên đường về, em nói với bố rằng em mong sẽ quay lại.", "example": "They took a small gift on their family visit.", "examplevi": "Họ mang theo một món quà nhỏ trong chuyến thăm họ hàng."}, {"en": "show respect", "vi": "thể hiện sự kính trọng", "kind": "colloc", "context": "Linh had worried about saying the right words, but she soon felt comfortable. She knew that during a family visit, she could also show respect by listening and helping. On the way home, she told her father she hoped to visit again.", "contextvi": "Linh từng lo mình nói không đúng lời, nhưng em sớm thấy thoải mái. Em hiểu trong một chuyến thăm họ hàng, mình còn có thể thể hiện sự kính trọng bằng cách lắng nghe và giúp đỡ. Trên đường về, em nói với bố rằng em mong sẽ quay lại.", "example": "We can show respect by listening while others speak.", "examplevi": "Chúng ta có thể thể hiện sự kính trọng bằng cách lắng nghe khi người khác nói."}, {"en": "great-aunt", "vi": "bà dì hoặc bà cô", "kind": "vocab", "context": "Linh had practised one greeting on the bus. When her great-aunt opened the door, Linh smiled and wished her good health. Her great-aunt thanked her and led them into a bright room with flowers on the table.", "contextvi": "Linh đã tập một lời chúc trên xe buýt. Khi bà dì mở cửa, Linh mỉm cười và chúc bà mạnh khỏe. Bà cảm ơn em rồi dẫn hai bố con vào một căn phòng sáng, trên bàn có hoa.", "example": "Linh sat beside her great-aunt.", "examplevi": "Linh ngồi cạnh bà dì của mình."}, {"en": "comfortable", "vi": "thoải mái", "kind": "vocab", "context": "Linh had worried about saying the right words, but she soon felt comfortable. She knew that during a family visit, she could also show respect by listening and helping. On the way home, she told her father she hoped to visit again.", "contextvi": "Linh từng lo mình nói không đúng lời, nhưng em sớm thấy thoải mái. Em hiểu trong một chuyến thăm họ hàng, mình còn có thể thể hiện sự kính trọng bằng cách lắng nghe và giúp đỡ. Trên đường về, em nói với bố rằng em mong sẽ quay lại.", "example": "After a few minutes I felt comfortable.", "examplevi": "Sau vài phút tôi thấy thoải mái."}], "image": "data:image/webp;base64,UklGRliBAABXRUJQVlA4IEyBAABQVwGdASo+AT0BPkUaikOioaEWjN6wKAREsjQjszyKVUQTDxe4LQq/iB0sMo+dv4H979FTj/sa+JfdPOX1Dddfsb6enUPnY/2v7Re7n+qf6n2Cv65/hfVV/3P2j95P98/7fqS/rf/B/cv3dP+t+5HvH/tX/Q9hD+y/7f/7+1/6rf+c/8v//9xf93PTt/dH4Zv7Z/2P3d+B/9tP/v7AH//9u3mX4QvIj8f+S3mr46fXf71/mP+H/e/cP/zPAv1V/2vQb+Wff79f/fP83/2/8R81f6P/p/5/yJ+R3+H90/yEfk/88/zn9l/dv/G/Jd9d293Df6P/wf6n2C/aT61/v/75+9X+m+D77H/o+i/2Q/6H+Y/LH7Av59/WP9x/e/3p/f////cv/W8Rf7x/zv3H+AX+if4n/zf5r3c/8H/3f6r/b/uz7nvqj/z/6b/a/IZ/Of7j/z/8T/pP2s/////8pX75e1AUHPTCWwFHuH2iNm90QekUMcCtKCH9O6/rbgrx9Dfn99EZY/woSSn4hnFuVayolDJKYfBfFaYSGPUwQsxwZBFAJx3Cun0NKmF972eB2X6FCufkiexrmA6djrG4qU6e/zWA0h3GI6VkMam1xH9KTQdzhiMq4HSmLc/C3mkejN7KkT+x+m0/Oe/ktP0nshncD1fymRfZOiU1fHIdOT4LudCpz9oDs5fz+gUQOD3/  she had noticed on the wall.", "the", "an", "Ø"]], "wf": [["greet", "greeting", "Linh practised a ________ before the visit."], ["respect", "respectful", "Linh was ________ when her great-aunt told a story."]], "chunks": [["Linh had spent Tet in the city for several years.", "Linh đã đón Tết ở thành phố vài năm.", ["Linh had spent Tet", "in the city", "for several years."]], ["This time, she travelled with her father to visit older relatives.", "Lần này, em cùng bố đi thăm họ hàng lớn tuổi.", ["This time,", "she travelled", "with her father to", "visit older relatives."]], ["At the gate, he handed her a small box of tea and reminded her to greet everyone before giving the gift.", "Ở cổng, bố đưa em một hộp trà nhỏ và nhắc em chào mọi người trước khi tặng quà.", ["At the gate,", "he handed her a", "small box of tea", "and reminded her to", "greet everyone", "before giving the gift."]], ["When her great-aunt opened the door, Linh smiled and wished her good health.", "Khi bà dì mở cửa, Linh mỉm cười và chúc bà mạnh khỏe.", ["When her great-aunt opened", "the door,", "Linh smiled", "and", "wished her good health."]], ["Her great-aunt thanked her and led them into a bright room with flowers on the table.", "Bà cảm ơn em rồi dẫn hai bố con vào một căn phòng sáng, trên bàn có hoa.", ["Her great-aunt thanked her", "and led them into", "a bright room", "with flowers", "on the table."]], ["Before pouring tea, Linh offered to help set the table.", "Trước khi rót trà, Linh đề nghị giúp bày bàn.", ["Before pouring tea,", "Linh offered to", "help set the table."]], ["As she put them out, Linh noticed an old clock and asked about it.", "Trong lúc bày chén, Linh để ý một chiếc đồng hồ cũ và hỏi về nó.", ["As she put them", "out, Linh noticed an", "old clock", "and asked about it."]], ["The question led to a story about the house before her father was born.", "Câu hỏi dẫn đến một câu chuyện về ngôi nhà trước khi bố em ra đời.", ["The question led to", "a story about the", "house before her father", "was born."]]], "output": ["What gift might you take when visiting relatives?", "How can you show respect during a visit?", "What can an old object tell you?", "Write 70–90 words giving a friend advice about visiting relatives during a holiday."], "models": ["I might take some fruit or tea. I would choose something I know they enjoy.", "I can greet everyone, listen when someone speaks and offer to help with small jobs.", "An old object can start a story about how people lived. I would ask when the family first got it."], "drills": [["We often ________ at the start of the holiday.", "visit older relatives"], ["Linh smiled and ________.", "wished her good health"], ["May I ________ before the guests arrive?", "help set the table"], ["They took a small gift on their ________.", "family visit"], ["We can ________ by listening while others speak.", "show respect"]]}, {"id": 23, "ch": 5, "title": "Lanterns in the Courtyard", "genre": "School Report", "p": [{"en": "Before the Mid-Autumn Festival, our class decided to **make paper lanterns** for an evening event. We had a box of coloured paper and a few sticks. We planned to turn on battery lights inside the **lanterns** after the sky grew dark.", "vi": "Trước Tết Trung thu, lớp chúng tôi quyết định làm đèn lồng giấy cho một sự kiện buổi tối. Chúng tôi có một hộp giấy màu và vài que. Chúng tôi dự định bật đèn chạy pin bên trong lồng đèn khi trời tối."}, {"en": "My group made a star shape. Another group made simple round lanterns and offered to swap one with us. Before the event, we **tested the lights** because we did not want any lantern to stop working halfway through the evening.", "vi": "Nhóm tôi làm hình ngôi sao. Nhóm khác làm đèn lồng tròn đơn giản và đề nghị đổi một chiếc với chúng tôi. Trước sự kiện, chúng tôi thử đèn vì không muốn chiếc nào tắt khi chương trình mới diễn ra được một nửa."}, {"en": "We also helped **arrange a fruit tray**. The teacher asked us to leave a clear route to the gate. We moved one table to the side so families could walk through while children **carried their lanterns** around the **courtyard**.", "vi": "Chúng tôi còn giúp bày một mâm trái cây. Cô giáo nhờ chừa lối thông ra cổng. Chúng tôi chuyển một chiếc bàn sang bên để các gia đình có thể đi qua trong lúc các em nhỏ rước đèn quanh sân."}, {"en": "At the end, we gave away some fruit and **put everything away**. A younger pupil asked if he could make a star lantern next year. I told him he could start by making a small paper model at home.", "vi": "Cuối buổi, chúng tôi chia bớt trái cây và dọn cất mọi thứ. Một em học sinh lớp dưới hỏi liệu năm sau em có thể làm đèn ông sao không. Tôi bảo em có thể bắt đầu bằng một mô hình giấy nhỏ ở nhà."}], "v": [{"en": "make paper lanterns", "vi": "làm đèn lồng giấy", "kind": "colloc", "context": "Before the Mid-Autumn Festival, our class decided to make paper lanterns for an evening event. We had a box of coloured paper and a few sticks. We planned to turn on battery lights inside the lanterns after the sky grew dark.", "contextvi": "Trước Tết Trung thu, lớp chúng tôi quyết định làm đèn lồng giấy cho một sự kiện buổi tối. Chúng tôi có một hộp giấy màu và vài que. Chúng tôi dự định bật đèn chạy pin bên trong lồng đèn khi trời tối.", "example": "Our class plans to make paper lanterns for the festival.", "examplevi": "Lớp chúng tôi dự định làm đèn lồng giấy cho lễ hội."}, {"en": "tested the lights", "vi": "đã thử đèn", "kind": "colloc", "context": "My group made a star shape. Another group made simple round lanterns and offered to swap one with us. Before the event, we tested the lights because we did not want any lantern to stop working halfway through the evening.", "contextvi": "Nhóm tôi làm hình ngôi sao. Nhóm khác làm đèn lồng tròn đơn giản và đề nghị đổi một chiếc với chúng tôi. Trước sự kiện, chúng tôi thử đèn vì không muốn chiếc nào tắt khi chương trình mới diễn ra được một nửa.", "example": "We tested the lights in a dark room before the event.", "examplevi": "Chúng tôi đã thử đèn trong một căn phòng tối trước sự kiện."}, {"en": "arrange a fruit tray", "vi": "bày mâm trái cây", "kind": "colloc", "context": "We also helped arrange a fruit tray. The teacher asked us to leave a clear route to the gate. We moved one table to the side so families could walk through while children carried their lanterns around the courtyard.", "contextvi": "Chúng tôi còn giúp bày một mâm trái cây. Cô giáo nhờ chừa lối thông ra cổng. Chúng tôi chuyển một chiếc bàn sang bên để các gia đình có thể đi qua trong lúc các em nhỏ rước đèn quanh sân.", "example": "Can you help me arrange a fruit tray before the guests arrive?", "examplevi": "Bạn giúp tôi bày mâm trái cây trước khi khách đến được không?"}, {"en": "carried their lanterns", "vi": "đã rước đèn", "kind": "colloc", "context": "We also helped arrange a fruit tray. The teacher asked us to leave a clear route to the gate. We moved one table to the side so families could walk through while children carried their lanterns around the courtyard.", "contextvi": "Chúng tôi còn giúp bày một mâm trái cây. Cô giáo nhờ chừa lối thông ra cổng. Chúng tôi chuyển một chiếc bàn sang bên để các gia đình có thể đi qua trong lúc các em nhỏ rước đèn quanh sân.", "example": "The children carried their lanterns through the courtyard.", "examplevi": "Các em nhỏ đã rước đèn qua sân."}, {"en": "put everything away", "vi": "dọn cất mọi thứ", "kind": "colloc", "context": "At the end, we gave away some fruit and put everything away. A younger pupil asked if he could make a star lantern next year. I told him he could start by making a small paper model at home.", "contextvi": "Cuối buổi, chúng tôi chia bớt trái cây và dọn cất mọi thứ. Một em học sinh lớp dưới hỏi liệu năm sau em có thể làm đèn ông sao không. Tôi bảo em có thể bắt đầu bằng một mô hình giấy nhỏ ở nhà.", "example": "After the event, we need to put everything away.", "examplevi": "Sau sự kiện, chúng ta cần dọn cất mọi thứ."}, {"en": "lanterns", "vi": "đèn lồng", "kind": "vocab", "context": "Before the Mid-Autumn Festival, our class decided to make paper lanterns for an evening event. We had a box of coloured paper and a few sticks. We planned to turn on battery lights inside the lanterns after the sky grew dark.", "contextvi": "Trước Tết Trung thu, lớp chúng tôi quyết định làm đèn lồng giấy cho một sự kiện buổi tối. Chúng tôi có một hộp giấy màu và vài que. Chúng tôi dự định bật đèn chạy pin bên trong lồng đèn khi trời tối.", "example": "We hung lanterns by the door.", "examplevi": "Chúng tôi treo đèn lồng cạnh cửa."}, {"en": "courtyard", "vi": "sân", "kind": "vocab", "context": "We also helped arrange a fruit tray. The teacher asked us to leave a clear route to the gate. We moved one table to the side so families could walk through while children carried their lanterns around the courtyard.", "contextvi": "Chúng tôi còn giúp bày một mâm trái cây. Cô giáo nhờ chừa lối thông ra cổng. Chúng tôi chuyển một chiếc bàn sang bên để các gia đình có thể đi qua trong lúc các em nhỏ rước đèn quanh sân.", "example": "The children played in the courtyard.", "examplevi": "Các em nhỏ chơi trong sân."}], "image": "data:image/webp;base64,UklGRnZ+AABXRUJQVlA4IGp+AADQWgGdASo9AT0BPkUaikOioaEX6z40KAREtgBVaO0/juVC2X6v/KfuZ7ItgfxH9s/Xn95+YL9H1U+8f7ny4OiP+3/lvzI+ZH/Q/Zj3U/03/W+wP+un7Jf5v4Tf+H1rfud6i/21/b73df+v+4vu5/s/+5/bv4A/65/ov/D2JH70ewj+5X/29or/z/vN8MX9r/5v7nf+75If2m//nsAf/n2zP4B//+d/gS8Xv0/5X+avjp9xfuv+e/63+X9wb/j78HU3/n/1PqL/NPwz/C/xf5Ee9X/a/0fjr8i/971CPyv+l/7j/Aevl9h3RHC/7j9qvYX99ft3/Z/xnqffc/9z0j+0fsCf0X+3/8v2J8An89/2P20+Ab+u/539pfd0/yv/p/tP996v/rD/7f6n4EP6J/gf+3/if8z3VPSP/d8rHmO5TypRYBW0o2zqGGEczrjbhH+Cdo5QiD3zDv0MUubidvNtrXTnLmLpI+ziHms3mamS2D+yMSgXkzrQCPtMjMSr7USE8DC+fa49Hu4zaF6N6k2bz4WT3zKKiOcm7mlkXnybySXYAEiK/4JMRe7+KU92atrpHhFVJAjR81iyQFgej4M8FHGnzw0RGKaqoL41QlLrGku6pHFnjYyZlOJU19SYqsGMACDk3uzHUA6jDSfr9sEGPKx3Wm/YfZCkswtlHeBdyX3KeOFhj4FWdZ3HeK1+GIaLd865EnM96vxt+8BLF0M7hegoY1WBEhXn+Omf0jDOJpt5xYRak+KxAZs6kfOL
